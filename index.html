<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- le même texte que texte('nomDuJeu') (textes.js) ; jamais « F1 » ni « Formula 1 » : ce sont des marques -->
<title>Grand Prix Dynasty</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="scene3d"></div>
<div id="ips" class="cache"></div>
<!-- l'affichage provisoire de la conduite (étape 2) -->
<div id="tableau"><span id="rapport">1</span><span id="vitesse">0</span> <span id="unite"></span></div>
<button id="boutonSon" tabindex="-1">🔊</button>
<div id="sauvegardePerdue" class="cache" role="status"></div>
<div id="horsPiste" class="cache"></div>
<div id="aide"></div>

<!-- la course (étape 3) -->
<div id="hudCourse" class="cache">
  <div id="hudTour"></div>
  <div id="hudChrono"></div>
  <div id="hudEcart" class="cache"></div>   <!-- l'écart en direct avec le fantôme (qualification) -->
  <div id="hudPrecedent" class="cache"></div>
  <div id="hudMeilleur"></div>
  <div id="hudSecteurs"><span id="hudS1" class="secteur"></span><span id="hudS2" class="secteur"></span><span id="hudS3" class="secteur"></span></div>
</div>
<!-- la tour de classement (en haut à droite) et le radar (en bas à gauche), pendant une course à plusieurs -->
<div id="classement" class="cache"><div id="classementPlace"></div><ol id="classementListe"></ol></div>
<canvas id="radar" class="cache" width="170" height="170"></canvas>
<canvas id="minicarte" class="cache" width="180" height="130"></canvas>   <!-- la minicarte : le circuit entier et toutes les voitures (minicarte.js) -->
<div id="meteoHud" class="cache"><span id="meteoIcone"></span><span id="meteoEau"></span><span id="meteoBarre"><i id="meteoPlein"></i></span></div>   <!-- la météo (meteo3d.js) : l'icône et l'eau sur la piste ; cachée au sec -->
<div id="gouttes" class="cache"></div>   <!-- les gouttes sur la visière, en vue cockpit sous la pluie -->
<div id="pneusHud" class="cache"><span id="pneusTexte"></span><span id="pneusBarre"><i id="pneusPlein"></i></span><span id="pneusAdherence"></span></div>   <!-- ?pneus=1 : l'usure et l'adhérence perdue -->
<div id="messageCourse" class="cache"></div>   <!-- les messages de course (messages.js), un à la fois -->
<div id="hudPenalite" class="cache"></div>
<div id="hudStand" class="cache"></div>   <!-- l'arrêt au stand (étape 7) : le tour conseillé, l'arrêt en cours, les pneus neufs -->
<div id="compte" class="cache"></div>
<div id="attenteArrivee" class="cache"><span id="attenteTexte"></span><button id="boutonPasser"></button></div>
<div id="feux" class="cache"><span></span><span></span><span></span><span></span><span></span></div>
<!-- le départ parfait (depart.js) : la jauge du régime de départ avec sa zone verte, au centre bas, puis le résultat -->
<div id="jauge" class="cache"><div id="jaugeBarre"><div id="jaugeVert"></div><div id="jaugeAiguille"></div></div><div id="jaugeAide"></div></div>
<div id="departResultat" class="cache"></div>
<!-- le mode 2 joueurs (deux-joueurs.js, écran partagé haut / bas) : l'affichage de chaque moitié (place, tour, vitesse, écart avec l'autre),
     les feux, la jauge et le résultat du départ du joueur 2 dans sa moitié (ceux du joueur 1 sont les éléments ci-dessus, déplacés par CSS) -->
<div id="deuxSeparation" class="cache"></div>
<div id="deuxHaut" class="deuxHud cache"><span class="deuxNom"></span><span class="deuxPlace"></span><span class="deuxTour"></span><span class="deuxVitesse"></span><span class="deuxEcart"></span></div>
<div id="deuxBas" class="deuxHud cache"><span class="deuxNom"></span><span class="deuxPlace"></span><span class="deuxTour"></span><span class="deuxVitesse"></span><span class="deuxEcart"></span></div>
<div id="feux2" class="cache"><span></span><span></span><span></span><span></span><span></span></div>
<div id="jauge2" class="cache"><div id="jaugeBarre2"><div id="jaugeVert2"></div><div id="jaugeAiguille2"></div></div><div id="jaugeAide2"></div></div>
<div id="departResultat2" class="cache"></div>

<!-- le premier lancement (decouverte.js) : l'écran titre, « Entre amis » (bientôt), les aides de la découverte, « Prêt pour ta carrière ? » -->
<section id="titre" class="ecran cache">
  <h1 id="titreNom"></h1>
  <div class="boutons"><button id="boutonJouer" tabindex="-1"></button></div>
  <div class="boutons"><button id="boutonAmis" class="petit" tabindex="-1"></button></div>
  <div class="boutons"><button id="boutonTutorielTitre" class="petit" tabindex="-1"></button></div>   <!-- « Apprendre à piloter » (tutoriel.js, Codeur 4) : proposé, jamais imposé -->
</section>
<!-- « Entre amis » (titre et paddock) : le petit menu, puis l'écran avant la course à deux (deux-joueurs.js, tour 25b) -->
<section id="amis" class="ecran cache">
  <h1 id="amisTitre"></h1>
  <div class="boutons"><button id="boutonAmisDeux" tabindex="-1"></button><button id="boutonAmisTournoi" tabindex="-1"></button></div>
  <div class="boutons"><button id="boutonAmisRetour" class="petit" tabindex="-1"></button></div>
</section>
<section id="deuxReglages" class="ecran cache">
  <h1 id="deuxTitre"></h1>
  <div id="deuxJoueurs">
    <div class="deuxJoueur" id="deuxJoueur1"><h2></h2>
      <label><span class="deuxNomTexte"></span><input id="deuxNom1" type="text" maxlength="12" autocomplete="off" spellcheck="false"></label>
      <label><span class="deuxCouleurTexte"></span><span class="deuxCouleurs" id="deuxCouleurs1"></span></label>
      <label><span class="deuxCasqueTexte"></span><span class="deuxCasque"><span class="deuxIcone" id="deuxIcone1"></span><select id="deuxMotif1"></select><input id="deuxCasque1a" type="color"><input id="deuxCasque1b" type="color"><input id="deuxCasque1c" type="color"></span></label>
      <p class="deuxTouches"></p></div>
    <div class="deuxJoueur" id="deuxJoueur2"><h2></h2>
      <label><span class="deuxNomTexte"></span><input id="deuxNom2" type="text" maxlength="12" autocomplete="off" spellcheck="false"></label>
      <label><span class="deuxCouleurTexte"></span><span class="deuxCouleurs" id="deuxCouleurs2"></span></label>
      <label><span class="deuxCasqueTexte"></span><span class="deuxCasque"><span class="deuxIcone" id="deuxIcone2"></span><select id="deuxMotif2"></select><input id="deuxCasque2a" type="color"><input id="deuxCasque2b" type="color"><input id="deuxCasque2c" type="color"></span></label>
      <p class="deuxTouches"></p></div>
  </div>
  <div id="deuxCourse">
    <label><span id="deuxCircuitTexte"></span><select id="deuxCircuit"></select></label>
    <label><span id="deuxToursTexte"></span><select id="deuxTours"></select></label>
    <label><span id="deuxIATexte"></span><select id="deuxIA"></select></label>
    <label><span id="deuxNiveauTexte"></span><select id="deuxNiveau"></select></label>
  </div>
  <p id="deuxErreur"></p>
  <div class="boutons"><button id="boutonDeuxPartir" tabindex="-1"></button><button id="boutonDeuxRetour" class="petit" tabindex="-1"></button></div>
</section>
<!-- le tournoi chrono entre copains (tournoi.js, tour 26b) : l'inscription, « À toi ! », la pause d'un tour, le classement de la manche, la fin -->
<section id="tournoiInscription" class="ecran cache" data-formule="tournoi">
  <h1 id="tournoiTitre"></h1>
  <ol id="tournoiListe"></ol>
  <div class="boutons"><button id="boutonTournoiAjouter" class="petit" tabindex="-1"></button></div>
  <div class="boutons" id="tournoiFormules"><button id="boutonFormuleEclair" tabindex="-1"></button><button id="boutonFormuleTournoi" tabindex="-1"></button></div>
  <div id="tournoiCircuits"><span id="tournoiCircuitsTexte"></span><select id="tournoiCircuit0"></select><select id="tournoiCircuit1"></select><select id="tournoiCircuit2"></select></div>
  <p id="tournoiErreur"></p>
  <div class="boutons"><button id="boutonTournoiPartir" tabindex="-1"></button><button id="boutonTournoiRetour" class="petit" tabindex="-1"></button></div>
</section>
<section id="tournoiAToi" class="ecran cache">
  <div id="atoiIcone"></div>
  <h1 id="atoiTitre"></h1>
  <p id="atoiManche"></p>
  <div id="atoiCompte"></div>
  <p id="atoiAide"></p>
</section>
<section id="tournoiPause" class="ecran cache">
  <h1 id="tournoiPauseTitre"></h1>
  <div class="boutons"><button id="boutonTournoiReprendre" tabindex="-1"></button><button id="boutonTournoiAbandon" tabindex="-1"></button></div>
</section>
<section id="tournoiManche" class="ecran cache">
  <h1 id="tournoiMancheTitre"></h1>
  <p id="tournoiPhrase"></p>
  <div id="tournoiTableaux">
    <ol id="tournoiMancheListe" class="tournoiTableau"></ol>
    <div id="tournoiGeneral" class="cache"><h2 id="tournoiGeneralTitre"></h2><ol id="tournoiGeneralListe" class="tournoiTableau"></ol></div>
  </div>
  <div class="boutons"><button id="boutonTournoiSuite" tabindex="-1"></button></div>
</section>
<section id="tournoiFin" class="ecran cache">
  <h1 id="tournoiFinTitre"></h1>
  <ol id="tournoiFinListe" class="tournoiTableau"></ol>
  <div class="boutons"><button id="boutonTournoiRejouer" tabindex="-1"></button><button id="boutonTournoiNouveaux" tabindex="-1"></button></div>
</section>
<div id="aides" class="cache"><span id="aideGaz"></span><span id="aideDirection"></span><span id="aideFrein"></span></div>
<section id="bravo" class="ecran cache">
  <h1 id="bravoTitre"></h1>
  <p id="bravoPlace"></p>
  <p id="bravoArgent"></p>
  <h2 id="bravoQuestion"></h2>
  <div class="boutons"><button id="boutonCarriere" tabindex="-1"></button></div>
  <div class="boutons"><button id="boutonTutorielBravo" class="petit" tabindex="-1"></button></div>   <!-- « D’abord apprendre » (tutoriel.js, Codeur 4) -->
</section>

<!-- la création du pilote (pilote.js) : après « Prêt pour ta carrière ? », ou au chargement d'une sauvegarde sans pilote -->
<section id="pilote" class="ecran cache">
  <h1 id="piloteTitre"></h1>
  <div id="piloteChamps">
    <label><span id="piloteNomTexte"></span><input id="piloteNom" type="text" maxlength="12" autocomplete="off" spellcheck="false"></label>
    <label><span id="piloteNumeroTexte"></span><input id="piloteNumero" type="number" min="1" max="99"></label>
    <label><span id="pilotePaysTexte"></span><select id="pilotePays"></select></label>
    <label id="piloteCoeurLigne"><span id="piloteCoeurTexte"></span><select id="piloteCoeur"></select></label>
    <p id="piloteDomicile"></p>
  </div>
  <!-- le casque (casque.js) : le motif, les trois couleurs, et le casque qui tourne en 3D -->
  <div id="casqueEditeur">
    <canvas id="casqueApercu" width="160" height="160"></canvas>
    <div id="casqueChamps">
      <h2 id="casqueTitre"></h2>
      <label><span id="casqueMotifTexte"></span><select id="casqueMotif"></select></label>
      <label><span id="casqueCouleursTexte"></span><span class="couleurs"><input id="casqueC1" type="color"><input id="casqueC2" type="color"><input id="casqueC3" type="color"></span></label>
    </div>
  </div>
  <p id="piloteErreur"></p>
  <div class="boutons"><button id="boutonPiloteValider" tabindex="-1"></button></div>
</section>

<section id="choix" class="ecran cache">
  <h1 id="choixTitre"></h1>
  <div id="choixListe"></div>
</section>

<!-- la qualification du joueur, avant une course contre les IA : le choix, puis le résultat -->
<section id="qualif" class="ecran cache">
  <h1 id="qualifTitre"></h1>
  <p id="qualifTexte"></p>
  <p id="qualifFantome"></p>   <!-- après le tour : nouveau record, ou l'écart final avec le fantôme -->
  <div class="boutons"><button id="boutonQualifTour" tabindex="-1"></button><button id="boutonQualifPasser" tabindex="-1"></button><button id="boutonQualifCourse" tabindex="-1"></button></div>
  <div class="boutons"><button id="boutonFantomeQualif" class="boutonFantome" tabindex="-1"></button></div>
</section>

<!-- ?championnat=1 : l'écran entre les courses -->
<section id="championnat" class="ecran cache">
  <!-- le paddock, l'écran d'accueil de la carrière (tour 32, Codeur 3) : le prochain Grand Prix en grand, toi (classement, duel,
       argent, sponsor, réputation), les classements, et les boutons rangés par usage -->
  <div id="paddock">
    <div id="paddockProchain" class="tvCarte">
      <p id="paddockSurtitre" class="tvSurtitre"></p>
      <h1 id="championnatTitre"></h1>
      <p id="prevision" class="cache"></p>   <!-- la météo prévue (meteo3d.js) -->
      <p id="paddockDomicile" class="cache"><span class="maison"></span> <span id="paddockDomicileTexte"></span></p>
      <canvas id="paddockCarte" width="330" height="170"></canvas>
      <p id="championnatGagne"></p>
    </div>
    <div id="paddockMoi" class="tvCarte">
      <div id="paddockMessages"><button id="boutonCourrier" class="petit" tabindex="-1"></button><button id="boutonParlerCoequipier" class="petit" tabindex="-1"></button><button id="boutonParlerPatron" class="petit" tabindex="-1"></button></div>
      <p id="paddockPlace"></p>
      <p id="championnatDuel"></p>
      <p id="championnatArgent"></p>
      <p id="championnatSponsor"></p>
      <div id="championnatReputation"></div>
    </div>
    <div id="championnatTableaux" class="tvCarte">
      <div><h2 id="championnatPilotesTitre"></h2><ol id="championnatPilotes"></ol></div>
      <div><h2 id="championnatEcuriesTitre"></h2><ol id="championnatEcuries"></ol></div>
    </div>
  </div>
  <div class="boutons" id="paddockBoutons">
    <div class="paddockGroupe"><span class="paddockGroupeNom" id="paddockGroupeCourse"></span><div><button id="boutonCourseSuivante" tabindex="-1"></button></div></div>
    <div class="paddockGroupe"><span class="paddockGroupeNom" id="paddockGroupeEquipe"></span><div><button id="boutonGarage" tabindex="-1"></button><button id="boutonSponsors" tabindex="-1"></button><button id="boutonMonCasque" class="petit" tabindex="-1"></button></div></div>
    <div class="paddockGroupe"><span class="paddockGroupeNom" id="paddockGroupeSaison"></span><div><button id="boutonCalendrier" class="petit" tabindex="-1"></button><button id="boutonAlbum" class="petit" tabindex="-1"></button><button id="boutonArbre" class="petit" tabindex="-1"></button></div></div>
    <div class="paddockGroupe"><span class="paddockGroupeNom" id="paddockGroupeAmis"></span><div><button id="boutonAmisPaddock" class="petit" tabindex="-1"></button></div></div>
  </div>
  <button id="boutonTutorielPaddock" class="petit coinPaddock" tabindex="-1"></button>   <!-- « Apprendre à piloter » (tutoriel.js, Codeur 4) : dans le coin en bas à gauche -->
  <button id="boutonRevoirAides" class="petit coinPaddock" tabindex="-1"></button>   <!-- « Revoir les aides » (aides.js, Codeur 4) : dans un coin du paddock -->
</section>
<!-- le calendrier de la saison (Codeur 3) : les 12 Grands Prix, faits ou à venir, le prochain mis en valeur, le Grand Prix à domicile marqué -->
<section id="calendrier" class="ecran cache">
  <h1 id="calendrierTitre"></h1>
  <ol id="calendrierListe"></ol>
  <div class="boutons"><button id="boutonCalendrierRetour" tabindex="-1"></button></div>
</section>
<!-- l'arbre de la dynastie (carriere.js, Codeur 3) : depuis le paddock et depuis le bilan ; chaque génération et les records de famille -->
<section id="arbre" class="ecran cache">
  <h1 id="arbreEcranTitre"></h1>
  <ol id="arbreGenerations"></ol>
  <p id="arbreFamille"></p>
  <p id="arbreCircuits"></p>
  <div class="boutons"><button id="boutonArbreRetour" tabindex="-1"></button></div>
</section>

<!-- ?championnat=1 : les sponsors (sponsors.js) : les offres au début de la saison, puis le rappel ; la fiche d'un rival (fiche.js) (Codeur 3) -->
<section id="sponsors" class="ecran cache">
  <h1 id="sponsorsTitre"></h1>
  <ul id="sponsorsListe"></ul>
  <div class="boutons"><button id="boutonSponsorsRetour" tabindex="-1"></button></div>
</section>
<section id="fiche" class="ecran cache">
  <div id="ficheCarte">
    <div id="fichePhoto"></div>
    <div id="ficheTexte">
      <h1 id="ficheNom"></h1>
      <p id="ficheInfos"></p>
      <p id="ficheCaractere"></p>
      <p id="ficheSaison"></p>
      <p id="ficheHistorique"></p>
      <p id="ficheDuels"></p>
      <p id="ficheCoequipier"></p>
      <p id="ficheRivalite"></p>
      <p id="ficheFamille"></p>
    </div>
  </div>
  <div class="boutons"><button id="boutonFicheDiscuter" tabindex="-1"></button><button id="boutonFicheRetour" tabindex="-1"></button></div>
</section>
<!-- le courrier des pilotes (courrier-pilotes.js, Codeur 3, étape 12b) : leurs messages, du plus récent au plus ancien ; « Répondre » ouvre la discussion -->
<section id="courrier" class="ecran cache">
  <h1 id="courrierTitre"></h1>
  <ol id="courrierListe"></ol>
  <div class="boutons"><button id="boutonCourrierRetour" tabindex="-1"></button></div>
</section>
<!-- les discussions (discussion.js, parle.js, Codeur 3, étape 12b) : écrire librement ou composer au clic ; il répond depuis son raisonnement -->
<section id="discussion" class="ecran cache">
  <div id="discussionCarte" class="tvCarte">
    <div id="discussionEntete"><div id="discussionPortrait"></div><div><p id="discussionSurtitre" class="tvSurtitre"></p><h1 id="discussionNom"></h1><p id="discussionHumeur"></p></div></div>
    <ol id="discussionFil"></ol>
    <div id="discussionComposeur"><select id="discussionCible" tabindex="-1"></select></div>
    <div id="discussionSaisie"><input id="discussionTexte" type="text" maxlength="140" autocomplete="off" spellcheck="false"><button id="boutonDiscussionEnvoyer" tabindex="-1"></button></div>
  </div>
  <div class="boutons"><button id="boutonDiscussionRetour" tabindex="-1"></button></div>
</section>

<!-- ?championnat=1 : la fin de saison (saisons.js, Codeur 3) : le classement final et le champion, le duel de la saison, les contrats, la retraite -->
<!-- la cérémonie du champion (Codeur 3) : le podium 3D derrière, le texte en haut, « Suite » en bas -->
<section id="ceremonie" class="ecran cache">
  <div id="ceremonieHaut">
    <p id="ceremonieSaison"></p>
    <h1 id="ceremonieTitre"></h1>
    <p id="ceremonieNom"></p>
    <p id="ceremonieDetail"></p>
  </div>
  <div class="boutons"><button id="boutonCeremonieSuite" tabindex="-1"></button></div>
</section>
<section id="saison" class="ecran cache">
  <h1 id="saisonTitre"></h1>
  <p id="saisonChampion"></p>
  <p id="saisonEcurie"></p>
  <div id="saisonTableaux"><div><h2 id="saisonPilotesTitre"></h2><ol id="saisonPilotes"></ol></div></div>
  <div class="boutons"><button id="boutonSaisonSuite" tabindex="-1"></button></div>
</section>
<section id="duelSaison" class="ecran cache">
  <h1 id="duelSaisonTitre"></h1>
  <p id="duelSaisonScore"></p>
  <p id="duelSaisonDetail"></p>
  <div class="boutons"><button id="boutonDuelSaisonSuite" tabindex="-1"></button></div>
</section>
<section id="contrats" class="ecran cache">
  <h1 id="contratsTitre"></h1>
  <p id="contratsNote"></p>
  <ul id="contratsListe"></ul>
  <div class="boutons"><button id="boutonRetraite" tabindex="-1"></button></div>
</section>
<section id="retraite" class="ecran cache">
  <h1 id="retraiteTitre"></h1>
  <p id="retraiteRaison"></p>
  <p id="retraiteBilan"></p>
  <!-- le bilan de carrière (étape 14, carriere.js, Codeur 3) -->
  <ul id="bilanStats"></ul>
  <p id="bilanDuels"></p>
  <p id="bilanUne"></p>
  <p id="bilanTemple"></p>
  <p id="bilanFamille"></p>
  <div id="bilanBoutons" class="boutons"><button id="boutonTemple" tabindex="-1"></button><button id="boutonArbreBilan" class="petit" tabindex="-1"></button><button id="boutonContinuerDynastie" tabindex="-1"></button><button id="boutonNouvelleDynastie" class="petit" tabindex="-1"></button></div>
</section>
<!-- la relève (carriere.js, Codeur 3) : l'héritier (prénom, numéro, lien, pays, course de cœur, motif du casque aux couleurs du parent) et l'arbre de la dynastie -->
<section id="heritier" class="ecran cache">
  <h1 id="heritierTitre"></h1>
  <p id="heritierParent"></p>
  <div id="heritierCorps">
    <div id="heritierForme">
      <label><span id="heritierPrenomTexte"></span><input id="heritierPrenom" type="text" autocomplete="off" spellcheck="false"></label>
      <p id="heritierFamille"></p>
      <label><span id="heritierNumeroTexte"></span><input id="heritierNumero" type="number"></label>
      <label><span id="heritierLienTexte"></span><select id="heritierLien"></select></label>
      <label><span id="heritierPaysTexte"></span><select id="heritierPays"></select></label>
      <label><span id="heritierCoeurTexte"></span><select id="heritierCoeur"></select></label>
      <label><span id="heritierMotifTexte"></span><select id="heritierMotif"></select></label>
    </div>
    <div id="heritierArbre"><h2 id="arbreTitre"></h2><ol id="arbreListe"></ol></div>
  </div>
  <p id="heritierErreur"></p>
  <div class="boutons"><button id="boutonHeritierValider" tabindex="-1"></button></div>
</section>
<!-- le temple de la renommée et les records de carrière (carriere.js, Codeur 3) -->
<section id="temple" class="ecran cache">
  <h1 id="templeTitre"></h1>
  <ol id="templeListe"></ol>
  <h2 id="templeRecordsTitre"></h2>
  <ul id="templeRecords"></ul>
  <div class="boutons"><button id="boutonTempleRetour" tabindex="-1"></button></div>
</section>

<!-- ?championnat=1 : le garage (garage.js, argent.js) : 4 améliorations, depuis l'écran du championnat (Codeur 3) -->
<section id="garage" class="ecran cache">
  <h1 id="garageTitre"></h1>
  <p id="garageSolde"></p>
  <p id="garageBonus"></p>
  <ul id="garageListe"></ul>
  <div class="boutons"><button id="boutonAileron" tabindex="-1"></button><button id="boutonGarageRetour" tabindex="-1"></button></div>
</section>
<!-- l'aileron (aileron.js, carte2d.js, Codeur 3) : depuis le garage, avant le Grand Prix : la carte de la prochaine course, le curseur, la voiture, deux barres ; aucun conseil -->
<section id="aileron" class="ecran cache">
  <h1 id="aileronTitre"></h1>
  <div id="aileronCorps">
    <canvas id="aileronCarte" width="360" height="270"></canvas>
    <div id="aileronReglage">
      <canvas id="aileronVoiture" width="220" height="90"></canvas>
      <div id="aileronCurseurLigne"><span id="aileronBas"></span><input id="aileronCurseur" type="range" min="0" max="4" step="1"><span id="aileronHaut"></span></div>
      <p id="aileronCran"></p>
      <div class="aileronBarre"><span id="aileronVirages"></span><div class="jaugeBarre"><i id="barreVirages"></i></div></div>
      <div class="aileronBarre"><span id="aileronVitesse"></span><div class="jaugeBarre"><i id="barreVitesse"></i></div></div>
    </div>
  </div>
  <div class="boutons"><button id="boutonAileronRetour" tabindex="-1"></button></div>
</section>

<!-- ?championnat=1 : la une du journal (journal.js), après les résultats ; un clic ou une touche la passe (Codeur 3) -->
<!-- ?championnat=1 : l'interview d'après course (interview.js), entre les résultats et la une du journal (Codeur 3) -->
<section id="interview" class="ecran cache">
  <div id="interviewCarte">
    <h1 id="interviewTitre"></h1>
    <p id="interviewJournaliste"></p>
    <p id="interviewQuestion"></p>
    <div id="interviewChoix">
      <ul id="interviewReponses"></ul>
      <div class="boutons"><button id="boutonPasCommentaire" class="petit" tabindex="-1"></button></div>
    </div>
    <div id="interviewSuite" class="cache">
      <p id="interviewEffet"></p>
      <div class="boutons"><button id="boutonInterviewSuite" tabindex="-1"></button></div>
    </div>
  </div>
</section>
<section id="une" class="ecran cache">
  <div id="unePage">
    <header id="uneEntete"><span id="uneNom"></span><span id="uneEdition"></span></header>
    <div id="uneCorps">
      <div id="unePrincipal">
        <h1 id="uneTitre"></h1>
        <p id="uneTexte"></p>
        <div id="unePhoto"></div>
      </div>
      <aside id="uneCote"><h2 id="uneBrevesTitre"></h2><ul id="uneBreves"></ul></aside>
    </div>
    <footer id="unePied"><h2 id="uneClassementTitre"></h2><ol id="uneClassement"></ol></footer>
  </div>
  <p id="unePasser"></p>
  <!-- l'album des unes (Codeur 3) : la même page, feuilletée depuis le paddock ; la barre n'est là qu'en mode album -->
  <div id="albumBarre" class="boutons"><button id="boutonAlbumSaisonAvant" class="petit" tabindex="-1">⏮</button><button id="boutonAlbumAvant" class="petit" tabindex="-1">◀</button><span id="albumPage"></span><button id="boutonAlbumApres" class="petit" tabindex="-1">▶</button><button id="boutonAlbumSaisonApres" class="petit" tabindex="-1">⏭</button><button id="boutonAlbumFermer" class="petit" tabindex="-1"></button></div>
</section>

<!-- le résumé vidéo de la course (resume.js, étape 13) : la 3D rejoue les moments forts ; un bandeau dit le moment ; un clic ou Échap pour sortir -->
<div id="annonceMotif" class="cache"></div>   <!-- « Nouveau motif : Couronne ! » (casque.js), au paddock, une fois -->
<!-- les aides au premier usage (aides.js ; l'affichage : AIDES_ECRAN dans interface.js, Codeur 4) : la bulle d'une ou deux lignes, un clic la ferme -->
<div id="bulleAide" class="cache" role="status"><span id="bulleAideTexte"></span><span id="bulleAideFermer" aria-hidden="true">✕</span></div>
<!-- le tutoriel guidé (tutoriel.js ; l'affichage : TUTORIEL_ECRAN dans interface.js, Codeur 4) : la liste des leçons, la consigne pendant une leçon, le résultat -->
<section id="tutoMenu" class="ecran cache"><h1 id="tutoMenuTitre"></h1><p id="tutoMenuIntro"></p><ol id="tutoListe"></ol><div class="boutons"><button id="boutonTutoRetour" tabindex="-1"></button></div></section>
<div id="tutoConsigne" class="cache"><span id="tutoConsigneTitre"></span><span id="tutoConsigneTexte"></span><button id="boutonTutoPasser" class="petit" tabindex="-1"></button></div>
<section id="tutoResultat" class="ecran cache"><h1 id="tutoResultatTitre"></h1><p id="tutoResultatTexte"></p><div class="boutons"><button id="boutonTutoRecommencer" tabindex="-1"></button><button id="boutonTutoSuivante" tabindex="-1"></button></div><div class="boutons"><button id="boutonTutoListe" class="petit" tabindex="-1"></button><button id="boutonTutoQuitter" class="petit" tabindex="-1"></button></div></section>
<section id="grille" class="cache"><p id="grilleAide"></p></section>   <!-- avant les feux : la grille vue d'en haut, passable -->
<section id="resume" class="cache"><div id="resumeBandeau"><span id="resumeTitre"></span><span id="resumeMoment"></span></div><p id="resumeCommentaire" class="cache"></p><p id="resumeSortir"></p></section>   <!-- le commentateur du résumé (commentaire.js) -->
<section id="pause" class="ecran cache">
  <h1 id="pauseTitre"></h1>
  <div class="boutons"><button id="boutonReprendre" tabindex="-1"></button><button id="boutonRecommencer" tabindex="-1"></button></div>
  <div class="boutons"><button id="boutonFantomePause" class="boutonFantome" tabindex="-1"></button><button id="boutonTrajectoirePause" class="petit" tabindex="-1"></button></div>   <!-- la trajectoire conseillée : oui, freinages seulement, non (conseil.js, sauvegardé) -->
  <div class="boutons"><button id="boutonCommentairePause" class="petit" tabindex="-1"></button><button id="boutonEffetsPause" class="petit" tabindex="-1"></button></div>   <!-- les effets de conduite : oui, non (sensations.js, sauvegardé) -->   <!-- le commentateur : tout, tes faits, coupé (commentaire.js) -->   <!-- le fantôme affiché ou masqué (sauvegardé) -->
  <div class="boutons"><button id="boutonFreinagePause" class="petit" tabindex="-1"></button><button id="boutonAntipatinagePause" class="petit" tabindex="-1"></button><button id="boutonDirectionPause" class="petit" tabindex="-1"></button></div>   <!-- les aides au pilotage (assistance.js) : une par bouton, oui / non, sauvegardées -->
  <div class="boutons"><button id="boutonRevoirAidesPause" class="petit" tabindex="-1"></button><button id="boutonQualitePause" class="petit" tabindex="-1"></button></div>   <!-- la qualité de l'image : auto, haute, basse (qualite.js, sauvegardé) -->   <!-- « Revoir les aides » (aides.js, Codeur 4) -->
  <div class="boutons"><button id="boutonTutorielPause" class="petit" tabindex="-1"></button></div>   <!-- « Apprendre à piloter » (tutoriel.js, Codeur 4) -->
</section>

<!-- après une course à plusieurs : le podium (sur la 3D), puis les résultats -->
<section id="podium" class="cache">
  <h1 id="podiumTitre"></h1>
  <div id="podiumMarches"></div>
  <p id="podiumDeux" class="cache"></p>   <!-- le mode 2 joueurs : la place des deux joueurs, même hors du podium -->
  <button id="boutonResultats" tabindex="-1"></button>
</section>

<section id="resultats" class="ecran cache">
  <h1 id="resultatsTitre"></h1>
  <table id="resultatsTable"><thead><tr id="resultatsEntete"></tr></thead><tbody id="resultatsLignes"></tbody></table>
  <p id="resultatsArgent"></p>
  <p id="resultatsRivalite" class="cache"></p>   <!-- le mode 2 joueurs : le score de la rivalité (« Léo 3 – 2 Sarah ») -->
  <div class="boutons"><button id="boutonResume" class="cache" tabindex="-1"></button><button id="boutonRejouerResultats" tabindex="-1"></button><button id="boutonChangerResultats" tabindex="-1"></button></div>
</section>

<section id="fin" class="ecran cache">

  <p id="finTotal"></p>
  <p id="finMeilleur"></p>
  <p id="finPenalites"></p>
  <ol id="finTours"></ol>
  <div class="boutons"><button id="boutonRejouer" tabindex="-1"></button><button id="boutonChanger" tabindex="-1"></button></div>
</section>
