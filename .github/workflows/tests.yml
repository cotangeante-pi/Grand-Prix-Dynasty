# Les tests du jeu sur les machines de GitHub, à chaque envoi (git push) sur n'importe quelle branche.
# Gratuit et sans limite : le dépôt est public. Le résultat se lit dans l'onglet « Actions » du dépôt.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:   # bouton « Run workflow » dans l'onglet Actions

# un nouvel envoi sur la même branche arrête le passage précédent, devenu inutile
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # chaque partie de tests/lancer.py dans un travail à elle, en parallèle (une « matrix ») : le passage dure le temps du plus long
  # travail, pas la somme ; ecrans.py est coupé en tranches (ECRANS_TRANCHE=k/n : une page sur n). Le passage n'est vert que si
  # tous les travaux le sont (fail-fast: false : un travail rouge n'arrête pas les autres, on voit tout ce qui casse).
  tests:
    name: ${{ matrix.nom }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nom: moteur, partie: moteur }
          - { nom: courses, partie: courses }
          - { nom: stands, partie: stands }
          - { nom: consignes, partie: consignes }
          - { nom: officiels, partie: officiels }
          - { nom: meteo, partie: meteo }
          - { nom: ecrans-1, partie: ecrans, tranche: 1/4 }
          - { nom: ecrans-2, partie: ecrans, tranche: 2/4 }
          - { nom: ecrans-3, partie: ecrans, tranche: 3/4 }
          - { nom: ecrans-4, partie: ecrans, tranche: 4/4 }
          - { nom: annexes, partie: annexes }
          - { nom: paquet, partie: paquet }
          - { nom: saison, partie: saison }   # la carrière entière jouée par le robot (tests/saison.py, Codeur 4)
          - { nom: premier, partie: premier }   # le premier lancement : clic → feux, médiane de 3 essais (tests/premier.py, Codeur 4)
          - { nom: recoins-1, partie: recoins, recoins: 'deux,tournoi' }   # les recoins que saison.py ne visite pas (tests/recoins.py, Codeur 4)
          - { nom: recoins-2, partie: recoins, recoins: 'fin,ecrans,tuto' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Google Chrome est déjà installé sur les machines de GitHub (google-chrome) ;
      # ecrans.py le prend par channel='chrome', donc pas de navigateur à télécharger.
      # (Essayé le 2026-10-22 : avec Chrome 150 comme sur le Mac, le test de la carte calculée en fond
      # reste rouge ici ; les écarts viennent de la machine, pas seulement de la version. Voir CLAUDE.md, « Aller plus vite ».)
      - name: Playwright
        run: pip install playwright

      # le Mac d'Elijah est en français et les tests attendent les textes français : même langue ici
      # (sinon navigator.language = en-US et le jeu s'affiche en anglais)
      - name: La partie ${{ matrix.nom }}
        env:
          LANG: fr_FR.UTF-8
          LANGUAGE: fr
          ECRANS_TRANCHE: ${{ matrix.tranche }}
          RECOINS: ${{ matrix.recoins }}
        run: |
          google-chrome --version
          python3 tests/lancer.py ${{ matrix.partie }}

      # les captures de tests/ecrans.py (et des autres parties), à télécharger depuis la page du passage, même en cas d'échec
      - name: Captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-${{ matrix.nom }}
          path: tests/captures/
          if-no-files-found: ignore
