# Les tests du jeu sur les machines de GitHub, à chaque envoi (git push) sur n'importe quelle branche.
# Gratuit et sans limite : le dépôt est public. Le résultat se lit dans l'onglet « Actions » du dépôt.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:   # bouton « Run workflow » dans l'onglet Actions

# un nouvel envoi sur la même branche arrête le passage précédent, devenu inutile
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # la même version de Chrome que sur le Mac d'Elijah (150) : les simulations d'IA ne donnent pas
      # exactement les mêmes chiffres d'une version de Chrome à l'autre (avec Chrome 155 : 6 tests d'IA rouges,
      # verts sur le Mac). Quand le Mac passe à une nouvelle version, changer le numéro ici aussi.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: 150
          install-dependencies: true

      # lancer.py prend « google-chrome » et ecrans.py channel='chrome' (/opt/google/chrome/chrome) :
      # les deux pointent sur le Chrome 150 installé ci-dessus
      - name: Chrome 150 par défaut, et Playwright
        run: |
          sudo ln -sf "${{ steps.chrome.outputs.chrome-path }}" /usr/bin/google-chrome
          sudo ln -sf "${{ steps.chrome.outputs.chrome-path }}" /opt/google/chrome/chrome
          pip install playwright

      # le Mac d'Elijah est en français et les tests attendent les textes français : même langue ici
      # (sinon navigator.language = en-US et le jeu s'affiche en anglais)
      - name: Toute la suite (moteur, courses, ecrans, annexes)
        env:
          LANG: fr_FR.UTF-8
          LANGUAGE: fr
        run: |
          google-chrome --version
          python3 tests/lancer.py

      # les captures de tests/ecrans.py, à télécharger depuis la page du passage, même en cas d'échec
      - name: Captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: tests/captures/
          if-no-files-found: ignore
