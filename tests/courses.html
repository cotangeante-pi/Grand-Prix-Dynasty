<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>courses entre IA</title></head><body>
<pre id="res"></pre>
<script>window.__err=[];window.addEventListener('error',e=>__err.push(e.message+' @'+e.filename+':'+e.lineno));</script>
<script src="../donnees.js"></script><script src="../aleatoire.js"></script><script src="../circuits.js"></script><script src="../physique.js"></script><script src="../course.js"></script><script src="../ia.js"></script><script src="../simulation.js"></script><script src="../aileron.js"></script><script src="../pneus-donnees.js"></script><script src="../pneus.js"></script>
<script>
// Le critère de l'étape 4 : des courses entre IA, sans affichage. RESULTAT : le critère de 4b course par course ;
// et celui de 4c (les dépassements) quand les IA attaquent (REGLAGES.IA_DEPASSEMENT). ?graines=15 (par circuit, 15 par défaut),
// ?voitures=10, ?tours=5. Résumé : dépassements (et où), vainqueur ≠ poleman, meilleur rythme dans les 3 premiers,
// chocs à plus de 5 m/s (où, à quelle vitesse), barrières, coupes, herbe, temps de calcul ; puis la course de 20 voitures.
const Q=new URLSearchParams(location.search),GRAINES=+(Q.get('graines')||15),NB=+(Q.get('voitures')||10),TOURS=+(Q.get('tours')||5);
// ?ailerons=1 (tour 29c, Codeur 3) : chaque IA règle son aileron avant la course (aileron.js : le profil du circuit, son caractère,
// la graine de la course) ; les mêmes garde-fous doivent tenir. Sans ce paramètre, rien ne change (le cran du milieu partout).
// Pas encore dans la suite (tests/lancer.py) : il dépasse les garde-fous, d'où AILERON_IA_ACTIF = false (donnees.js) ; à lancer à la main
if(Q.get('ailerons')==='1'){const sansAileron=creerCourseIA;creerCourseIA=function(circuit,nb,nbTours,graine,...reste){const e=sansAileron(circuit,nb,nbTours,graine,...reste);
  const prof=AILERON.profil(circuit);ALEATOIRE.semer(graine+REGLAGES.GRAINE_AILERON);for(const p of e.pilotes) if(!p.humain){p.aileron=AILERON.choisirIA(p.pilote&&p.pilote.caractere,prof);AILERON.appliquer(p.v,p.aileron);}ALEATOIRE.semer();return e;};}
const L=[];let ok=0,ko=0;
function t(n,f){try{f();ok++;L.push('✔ '+n);}catch(e){ko++;L.push('✘ '+n+' — '+e.message);}}
const v=(c,m)=>{if(!c)throw new Error(m||'faux');};
const ecrire=etape=>{document.getElementById('res').textContent=`${etape?'EN COURS ('+etape+') ':''}RESULTAT ${ok}/${ok+ko}\n`+L.join('\n');};
const circuits={test:CIRCUIT_TEST,technique:construireCircuit(CIRCUITS.technique)};
// les chocs forts d'une course, un par contact : { s, vitesse, numéros } (le plus fort des deux voitures)
function chocsForts(r){const n=r.voitures.flatMap(x=>x.chocs).filter(c=>c>5).length/2;return n;}
const t0=performance.now(),resultats=[];
for(const nom of ['test','technique']) for(let g=1;g<=GRAINES;g++){
  const r=simulerCourse(circuits[nom],NB,TOURS,g);r.nom=nom;r.graine=g;resultats.push(r);
  // où et à quelle vitesse ont eu lieu les chocs forts (vus par la voiture au plus petit numéro, pour ne pas les compter deux fois)
  r.chocsLieux=r.voitures.flatMap(x=>x.chocs.map((c,i)=>({c,s:x.lieuxChocs[i],n:x.numero}))).filter(x=>x.c>5).sort((a,b)=>a.s-b.s)
    .filter((x,i,tab)=>i%2===0).map(x=>(x.s===null?'?':x.s.toFixed(0))+' m à '+x.c.toFixed(1)+' m/s ('+endroitSur(carteDe(circuits[nom]),x.s)+')').join(', ');
  const V=r.voitures,parPlace=[...V].sort((a,b)=>a.place-b.place),pole=r.grille[0].numero,meilleur=[...V].sort((a,b)=>b.rythme-a.rythme)[0];
  const endroits={freinage:0,sortie:0,autre:0};r.depassements.forEach(d=>endroits[d.endroit]++);
  r.resume={dep:r.depassements.length,endroits,pasPole:parPlace[0].numero!==pole,top3:meilleur.place<=3,chocs:chocsForts(r),
    barr:V.reduce((a,x)=>a+x.contactsBarriere,0),coupes:V.reduce((a,x)=>a+x.coupes,0),herbe:V.reduce((a,x)=>a+x.herbe,0),fini:V.every(x=>x.fini),
    // les erreurs des pilotes (tour 16) : par type, celles évitées (une voiture trop près), l'herbe et les chocs forts pendant une erreur
    erreurs:{freinage:0,blocage:0,large:0},evitees:V.reduce((a,x)=>a+(x.erreursEvitees||0),0),herbeErreur:V.reduce((a,x)=>a+(x.herbeErreur||0),0),
    chocsErreur:V.reduce((a,x)=>a+(x.chocsErreur||[]).filter(c=>c>5).length,0)};
  for(const x of V) for(const e of x.erreurs||[]) r.resume.erreurs[e.type]++;
  const s=r.resume;
  L.push(`  ${nom} graine ${String(g).padStart(2)} : grille ${r.grille.map(x=>x.numero).join(',')} → arrivée ${parPlace.map(x=>x.numero).join(',')} | ${s.dep} dépassements (freinage ${endroits.freinage}, sortie ${endroits.sortie}, autre ${endroits.autre}) | pole n°${pole}, vainqueur n°${parPlace[0].numero} | meilleur rythme n°${meilleur.numero} P${meilleur.place} | chocs>5 ${s.chocs}${r.chocsLieux&&r.chocsLieux.length?' ('+r.chocsLieux+')':''} | barrière ${s.barr} | coupes ${s.coupes} | herbe ${s.herbe} | ${r.dureeMs.toFixed(0)} ms`);
  L.push(`      erreurs : freinage ${s.erreurs.freinage}, blocage ${s.erreurs.blocage}, large ${s.erreurs.large} (évitées ${s.evitees}) | herbe pendant les erreurs ${s.herbeErreur} | chocs>5 pendant une erreur ${s.chocsErreur}`);
  L.push('      caractères : '+V.map(x=>'n°'+x.numero+' r'+x.rythme.toFixed(3)+(x.caractere?' rég ±'+(x.caractere.regularite*100).toFixed(1)+'% agr '+x.caractere.agressivite.toFixed(2)+' err '+x.caractere.erreurs.toFixed(2):'')).join(' · '));
  ecrire(nom+' '+g);
}
const tot=resultats.reduce((a,r)=>{const s=r.resume;a.dep+=s.dep;a.pasPole+=s.pasPole;a.top3+=s.top3;a.chocs+=s.chocs;a.barr+=s.barr+s.coupes;a.herbe+=s.herbe;a.fini&=s.fini;a.chocsErreur+=s.chocsErreur;a.herbeErreur+=s.herbeErreur;a.evitees+=s.evitees;
  for(const k in s.erreurs) a.erreurs[k]+=s.erreurs[k];
  for(const k in s.endroits) a.endroits[k]+=s.endroits[k];return a;},{dep:0,pasPole:0,top3:0,chocs:0,barr:0,herbe:0,fini:true,endroits:{freinage:0,sortie:0,autre:0},chocsErreur:0,herbeErreur:0,evitees:0,erreurs:{freinage:0,blocage:0,large:0}});
const N=resultats.length,ms=performance.now()-t0;
L.push(`  TOTAL sur ${N} courses : ${tot.dep} dépassements (freinage ${tot.endroits.freinage}, sortie ${tot.endroits.sortie}, autre ${tot.endroits.autre}) ; vainqueur ≠ poleman ${tot.pasPole} ; meilleur rythme top 3 ${tot.top3} ; chocs > 5 m/s ${tot.chocs} ; barrières + coupes ${tot.barr} ; herbe hors erreurs ${tot.herbe} pas ; erreurs : freinage ${tot.erreurs.freinage}, blocage ${tot.erreurs.blocage}, large ${tot.erreurs.large} (évitées ${tot.evitees}, herbe pendant ${tot.herbeErreur} pas, chocs>5 pendant ${tot.chocsErreur}) ; calcul ${(ms/1000).toFixed(1)} s`);
// le critère de 4b, course par course : toutes arrivent, aucune barrière, aucune coupe, et au plus 1 choc à plus de
// 5 m/s. Quand les IA attaquent (tour 15), les chocs sont vérifiés sur le total des 30 courses (garde-fou plus bas) :
// course par course, ils sont seulement affichés
for(const r of resultats) t(`4b : ${r.nom}, graine ${r.graine} : toutes arrivent, aucune barrière, aucune coupe${REGLAGES.IA_DEPASSEMENT?'':', au plus 1 choc à plus de 5 m/s'}`,()=>{
  const s=r.resume;v(s.fini,'pas toutes arrivées');if(!REGLAGES.IA_DEPASSEMENT) v(s.chocs<=1,s.chocs+' chocs');v(s.barr===0,s.barr+' barrières');v(s.coupes===0,s.coupes+' coupes');});
// quand les IA attaquent (IA_DEPASSEMENT), pour 30 courses (à l'échelle sinon) :
// - les garde-fous (tour 15), vérifiés : au moins 25 dépassements, au plus 6 chocs à plus de 5 m/s, au plus 4000 pas
//   dans l'herbe, au plus 6 barrières + coupes ;
// - le critère complet de 4c, affiché seulement (pas encore tenu) : au moins 30 dépassements, vainqueur ≠ poleman
//   dans au moins 3 courses, meilleur rythme dans les 3 premiers dans au moins 20
if(REGLAGES.IA_DEPASSEMENT){const k=N/30;
  t(`garde-fou : au moins ${Math.ceil(25*k)} dépassements`,()=>v(tot.dep>=25*k,tot.dep));
  t(`garde-fou : au plus ${Math.floor(6*k)} chocs à plus de 5 m/s au total`,()=>v(tot.chocs<=6*k,tot.chocs));
  t('tour 16 : aucun choc à plus de 5 m/s causé par une erreur',()=>v(tot.chocsErreur===0,tot.chocsErreur));
  t(`garde-fou : au plus ${Math.floor(4000*k)} pas dans l’herbe au total (hors erreurs)`,()=>v(tot.herbe<=4000*k,tot.herbe));
  t(`garde-fou : au plus ${Math.floor(6*k)} barrières + coupes au total`,()=>v(tot.barr<=6*k,tot.barr));
  const tenu=(ok_,txt)=>L.push(`  4c (pas encore exigé) : ${txt} → ${ok_?'tenu':'PAS ENCORE TENU'}`);
  tenu(tot.dep>=30*k,`au moins ${Math.ceil(30*k)} dépassements (${tot.dep})`);
  tenu(tot.pasPole>=3*k,`vainqueur ≠ poleman dans au moins ${Math.ceil(3*k)} courses (${tot.pasPole})`);
  tenu(tot.top3>=18*k&&tot.top3<=28*k,`tour 16 : meilleur rythme dans les 3 premiers entre ${Math.ceil(18*k)} et ${Math.floor(28*k)} courses (${tot.top3})`);
  tenu(tot.chocs<=6*k&&tot.barr<=6*k&&tot.herbe<=4000*k&&tot.dep>=30*k&&tot.pasPole>=4*k,`tour 16 : ≥ ${Math.ceil(30*k)} dépassements, vainqueur ≠ poleman ≥ ${Math.ceil(4*k)}, chocs ≤ ${Math.floor(6*k)}, barrières + coupes ≤ ${Math.floor(6*k)}, herbe hors erreurs ≤ ${Math.floor(4000*k)}`);
  tenu(tot.top3>=20*k,`meilleur rythme dans les 3 premiers dans au moins ${Math.ceil(20*k)} courses (${tot.top3})`);}
// la course de 20 voitures, sur chaque circuit
for(const nom of ['test','technique']) t(`${nom}, 20 voitures, graine 1 : toutes arrivent, au plus 1 choc à plus de 5 m/s`,()=>{const r=simulerCourse(circuits[nom],20,TOURS,1);
  L.push(`  ${nom}, 20 voitures : ${r.depassements.length} dépassements, chocs>5 ${chocsForts(r)}, barrière ${r.voitures.reduce((a,x)=>a+x.contactsBarriere,0)}, herbe ${r.voitures.reduce((a,x)=>a+x.herbe,0)}, ${r.dureeMs.toFixed(0)} ms`);
  v(r.voitures.every(x=>x.fini));v(chocsForts(r)<=1,chocsForts(r)+' chocs');});
// --- l'effet de la rivalité de l'interview (Codeur 1, CLAUDE.md « Les rivaux se souviennent ») : sur le technique, 10 IA, une IA tient le
// rôle du joueur (v.joueur) et celle qui part juste derrière elle (l'attaque) ou juste devant (la défense) est son rival (pilote.rivalite) ;
// mêmes courses avec et sans rivalité
const RIV_GRAINES=+(Q.get('rivalite')||8);
function courseRivalite(g,rival,marquerJoueur,rivalDevant){const e=creerCourseIA(circuits.technique,10,TOURS,g),ordre=e.grille.map(x=>x.numero),jn=ordre[rivalDevant?5:4],rn=ordre[rivalDevant?4:5];
  const J=e.pilotes.find(p=>p.numero===jn),Rv=e.pilotes.find(p=>p.numero===rn);if(marquerJoueur)J.v.joueur=true;
  poserRivalites(e,e.pilotes.map(p=>rival&&p===Rv));
  const pasMax=Math.round(TOURS*REGLAGES.SIMULATION_TEMPS_MAX/REGLAGES.PAS_PHYSIQUE);for(let k=0;k<pasMax&&e.arrives<10;k++)pasCourseIA(e,REGLAGES.PAS_PHYSIQUE);
  const sur=(p,q)=>p.pilote.parCible.get(q.v)||{attaques:0,reussies:0};
  return {e,J,Rv,attaquesRival:sur(Rv,J).attaques,reussiesRival:sur(Rv,J).reussies,attaquesJoueur:sur(J,Rv).attaques,reussiesJoueur:sur(J,Rv).reussies,defenses:Rv.pilote.defenses,
    autres:e.pilotes.filter(p=>p!==J).reduce((a,p)=>a+sur(Rv,p).attaques,0),empreinte:e.pilotes.map(p=>p.arrivee+':'+p.v.x+':'+p.v.contactsVoiture).join('|'),
    chocs:e.pilotes.flatMap(p=>p.v.chocs).filter(c=>c>5).length/2,herbe:e.pilotes.reduce((a,p)=>a+p.herbe,0)};}
const riv={avec:[],sans:[],defAvec:[],defSans:[]};
for(let g=1;g<=RIV_GRAINES;g++){riv.avec.push(courseRivalite(g,true,true,false));riv.sans.push(courseRivalite(g,false,true,false));riv.defAvec.push(courseRivalite(g,true,true,true));riv.defSans.push(courseRivalite(g,false,true,true));ecrire('rivalité '+g);}
const sRiv=(l,f)=>l.reduce((a,x)=>a+f(x),0);
for(const nom of ['avec','sans','defAvec','defSans']) L.push(`  rivalité ${nom} (${RIV_GRAINES} courses de ${TOURS} tours, technique, rival ${nom.startsWith('def')?'devant':'derrière'} le joueur sur la grille) : le rival attaque le joueur ${sRiv(riv[nom],x=>x.attaquesRival)} fois (${sRiv(riv[nom],x=>x.reussiesRival)} réussies), les autres ${sRiv(riv[nom],x=>x.autres)} fois ; défenses ${sRiv(riv[nom],x=>x.defenses)} ; le joueur attaque le rival ${sRiv(riv[nom],x=>x.attaquesJoueur)} fois (${sRiv(riv[nom],x=>x.reussiesJoueur)} réussies) ; chocs>5 ${sRiv(riv[nom],x=>x.chocs)}, herbe ${sRiv(riv[nom],x=>x.herbe)}`);
t('rivalité : le rival (parti derrière le joueur) attaque plus souvent le joueur qu’un pilote sans rivalité, sur les mêmes courses',()=>v(sRiv(riv.avec,x=>x.attaquesRival)>sRiv(riv.sans,x=>x.attaquesRival),sRiv(riv.avec,x=>x.attaquesRival)+' / '+sRiv(riv.sans,x=>x.attaquesRival)));
t('rivalité : sa défense est plus serrée (le rival parti devant le joueur) : il couvre l’intérieur quand le joueur est dans ses rétroviseurs avant un freinage (défenses > 0, aucune sans rivalité), et le joueur ne le passe pas plus souvent',()=>{
  const da=sRiv(riv.defAvec,x=>x.defenses),ds=sRiv(riv.defSans,x=>x.defenses),ra=sRiv(riv.defAvec,x=>x.reussiesJoueur),rs=sRiv(riv.defSans,x=>x.reussiesJoueur);v(da>0&&ds===0&&ra<=rs,'défenses '+da+' / '+ds+', passé '+ra+' / '+rs);});
t('rivalité : pas de casse : pas plus de chocs à plus de 5 m/s qu’au total sans rivalité, toutes les voitures arrivent',()=>{const ca=sRiv(riv.avec,x=>x.chocs)+sRiv(riv.defAvec,x=>x.chocs),cs=sRiv(riv.sans,x=>x.chocs)+sRiv(riv.defSans,x=>x.chocs);
  v(ca<=cs&&riv.avec.concat(riv.defAvec).every(x=>x.e.pilotes.every(p=>p.arrivee!==null)),ca+' / '+cs);});
t('rivalité : contre les autres IA, rien ne change : avec la rivalité mais sans voiture du joueur, la course est identique au bit près à la course sans rivalité',()=>{
  for(let g=1;g<=2;g++){const a=courseRivalite(g,true,false),b=courseRivalite(g,false,false);v(a.empreinte===b.empreinte,'graine '+g);}});
t('rivalité : le plafond tient : un décalage demandé au-delà de INTERVIEW_RIVALITE_PLAFOND donne exactement la course du plafond ; et l’agressivité ne bouge que contre le joueur',()=>{
  const R_=REGLAGES,avant=R_.INTERVIEW_RIVALITE_DECALAGE;let a,b;try{R_.INTERVIEW_RIVALITE_DECALAGE=R_.INTERVIEW_RIVALITE_PLAFOND;a=courseRivalite(1,true,true);R_.INTERVIEW_RIVALITE_DECALAGE=5;b=courseRivalite(1,true,true);}finally{R_.INTERVIEW_RIVALITE_DECALAGE=avant;}
  v(a.empreinte===b.empreinte,'plafond pas tenu');const p={caractere:{agressivite:0.5},rivalite:true};
  v(agressivite(p,{joueur:true})===0.5+decalageRivalite()&&agressivite(p,{})===0.5&&agressivite(p)===0.5&&agressivite({caractere:{agressivite:0.5},rivalite:false},{joueur:true})===0.5&&decalageRivalite()<=R_.INTERVIEW_RIVALITE_PLAFOND,'agressivité');});
t('aucune erreur JavaScript',()=>v(__err.length===0,__err.join(' | ')));
ecrire();
</script></body></html>
