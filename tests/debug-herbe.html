<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="res"></pre>
<script src="../donnees.js"></script><script src="../aleatoire.js"></script><script src="../circuits.js"></script><script src="../physique.js"></script><script src="../course.js"></script><script src="../ia.js"></script><script src="../simulation.js"></script><script src="../pneus-donnees.js"></script><script src="../pneus.js"></script><script src="../circuits-officiels-a.js"></script><script src="../circuits-officiels-b.js"></script>
<script>
const Q=new URLSearchParams(location.search),cle=Q.get('c')||'monoco',L=[];
const def=Object.assign({},CIRCUITS_OFFICIELS_A,CIRCUITS_OFFICIELS_B)[cle],c=construireCircuit(def),carte=carteDepuis(c,calculerTrajectoire(c));
const e=creerCourseIA(c,10,3,+(Q.get('g')||1),carte),P=e.pilotes;const ep=[];const parS={};let cas={};
for(let k=0;k<3*150*120&&e.arrives<10;k++){pasCourseIA(e,REGLAGES.PAS_PHYSIQUE);
 for(const p of P){if(p.arrivee!==null)continue;const surH=p.v.surHerbe;
  if(surH&&!p.enH){p.enH=true;const s=p.v.piste.s,vir=carte.virages.reduce((m,x)=>{const d=ecartLeLong(c,s-x.s);return Math.abs(d)<Math.abs(m.d)?{d,x}:m},{d:1e9,x:null});
   const voisins=P.filter(q=>q!==p&&q.arrivee===null&&Math.abs(ecartLeLong(c,q.v.piste.s-s))<15).map(q=>{const g=ecartLeLong(c,q.v.piste.s-s);return (g>2.5?'devant':g<-2.5?'derriere':'acote')+' '+g.toFixed(1)+' d'+q.v.piste.d.toFixed(1);});
   const k2=(vir.d<0?'avant':'apres')+' sommet';cas[k2]=(cas[k2]||0)+1;
   const pl=p.pilote,li=pl.ligne,r_=li?ecartLeLong(c,s-li.s0):0;const eL=li?valeurLigne(li.e,r_):NaN,eL10=li?valeurLigne(li.e,r_+10):NaN,eR=ligneRapide(pl,s);ep.push({sens:vir.x.sens,vc:valeurEn(c,carte.trajectoire.vitesse,s),ec:valeurEn(c,carte.trajectoire.ecart,s),n:p.numero,s,d:p.v.piste.d,u:p.v.u,eL,eL10,eR,cap:(p.v.cap-pointPiste(c,s,0,[0,0])),vir:vir.x.s.toFixed(0),dv:vir.d.toFixed(0),choix:p.pilote.choix,cede:!!p.pilote.cede,att:p.pilote.attaque?p.pilote.attaque.etat:'',err:p.pilote.enErreur,vois:voisins.join(' / '),pas:0});}
  if(surH){ep[ep.length-1]&&0;const last=ep.filter(x=>x.n===p.numero).pop();if(last)last.pas++;}
  if(!surH)p.enH=false;}}
L.push(cle+' virages : '+carte.virages.map(x=>x.s.toFixed(0)+(x.lent?'L':'')).join(' '));
L.push('épisodes '+ep.length+' pas '+ep.reduce((a,x)=>a+x.pas,0)+' '+JSON.stringify(cas));
for(const x of ep.sort((a,b)=>b.pas-a.pas).slice(0,25))L.push(`n°${x.n} ${x.pas} pas s${x.s.toFixed(0)} (virage ${x.vir}, ${x.dv} m) d${x.d.toFixed(1)} ligne ${x.eL.toFixed(1)} (+10 m ${x.eL10.toFixed(1)}) rapide ${x.eR.toFixed(1)} carte ${x.ec.toFixed(1)} sens ${x.sens} u${x.u.toFixed(1)} (carte ${x.vc.toFixed(1)}) ${x.choix}${x.cede?' CEDE':''}${x.att?' ATT:'+x.att:''}${x.err?' ERR':''} | ${x.vois}`);
document.getElementById('res').textContent=L.join('\n');
</script></body></html>
