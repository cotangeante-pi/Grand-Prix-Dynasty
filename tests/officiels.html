<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>les IA sur les 12 tracés officiels</title></head><body>
<pre id="res"></pre>
<script>window.__err=[];window.addEventListener('error',e=>__err.push(e.message+' @'+e.filename+':'+e.lineno));</script>
<script src="../donnees.js"></script><script src="../aleatoire.js"></script><script src="../circuits.js"></script><script src="../physique.js"></script><script src="../course.js"></script><script src="../ia.js"></script><script src="../simulation.js"></script><script src="../pneus-donnees.js"></script><script src="../pneus.js"></script><script src="../circuits-officiels-a.js"></script><script src="../circuits-officiels-b.js"></script>
<script>
// Les IA sur les 12 tracés officiels (tour 31, Codeur 1), EN SIMULATION SEULEMENT : rien n'est branché dans le jeu (les tracés
// attendent l'accord d'Elijah). Pour chaque tracé : la carte des IA se calcule (temps) ; une IA seule fait 2 tours (temps au tour,
// barrières, herbe, coupes) ; 10 IA font 3 tours sans pneus (chocs > 5 m/s, herbe, barrières, coupes, dépassements, toutes arrivées) ;
// avec les pneus, 4 tours et un arrêt de chacune au tour 2 ou 3, une sur deux (la voie des stands : arrêts faits, muret, pénalités de vitesse).
// EXIGÉ : chaque carte se calcule ; chaque IA seule fait ses 2 tours sans barrière ni herbe ; l'usure (5, 12, 18 tours, plus bas). Le reste est mesuré et affiché.
// ?circuits=monoco,spaa pour n'en lancer que quelques-uns.
const Q=new URLSearchParams(location.search),FILTRE=Q.get('circuits'),GRAINES=+(Q.get('graines')||1),AVEC_PNEUS=Q.get('pneus')!=='0';
const L=[];let ok=0,ko=0;
function t(n,f){try{f();ok++;L.push('✔ '+n);}catch(e){ko++;L.push('✘ '+n+' — '+e.message);}}
const v=(c,m)=>{if(!c)throw new Error(m||'faux');};
const ecrire=etape=>{document.getElementById('res').textContent=`${etape?'EN COURS ('+etape+') ':''}RESULTAT ${ok}/${ok+ko}\n`+L.join('\n');};
const DT=REGLAGES.PAS_PHYSIQUE,chocs=V=>V.flatMap(x=>x.v.chocs).filter(c=>c>5).length/2,somme=(V,f)=>V.reduce((a,x)=>a+f(x),0);
const TOUS=Object.assign({},CIRCUITS_OFFICIELS_A,CIRCUITS_OFFICIELS_B),tableau=[];
function rouler(e,nb){const pasMax=Math.round(nb*REGLAGES.SIMULATION_TEMPS_MAX/DT);for(let k=0;k<pasMax&&e.arrives<e.pilotes.length;k++)pasCourseIA(e,DT);return e;}
for(const [cle,def] of Object.entries(TOUS)){
  if(FILTRE&&!FILTRE.split(',').includes(cle))continue;
  const r={cle,nom:def.nom};tableau.push(r);
  t(def.nom+' : la carte des IA se calcule',()=>{const t0=performance.now();r.c=construireCircuit(def);r.carte=carteDepuis(r.c,calculerTrajectoire(r.c));r.msCarte=performance.now()-t0;
    CARTES.set(r.c,r.carte);v(r.carte.virages.length>0&&r.carte.trajectoire.vitesse.every(x=>x>0&&isFinite(x)),'carte');r.longueur=r.c.longueur;r.virages=r.carte.virages.length;});
  if(!r.carte){ecrire(cle);continue;}
  t(def.nom+' : une IA seule fait 2 tours, sans barrière ni herbe',()=>{const e=creerCourseIA(r.c,1,2,1,r.carte),p=e.pilotes[0];p.course.compte=0;rouler(e,2);
    r.seule={fini:p.arrivee!==null,tours:p.course.tours.map(x=>x.temps),barr:p.v.contactsBarriere,herbe:p.herbe,coupes:Math.round(p.course.penalites/REGLAGES.PENALITE_COUPE)};
    v(r.seule.fini,'pas arrivée');v(r.seule.barr===0&&r.seule.herbe===0,'barrières '+r.seule.barr+', herbe '+r.seule.herbe);});
  // 10 IA, 3 tours sans pneus ; puis 4 tours avec les pneus et un arrêt au tour 2 ou 3 (mesuré, pas exigé)
  for(const pneus of (AVEC_PNEUS?[false,true]:[false])){
    const avant=REGLAGES.PNEUS_ACTIFS;REGLAGES.PNEUS_ACTIFS=pneus;
    try{const tot={fini:true,chocs:0,herbe:0,barr:0,coupes:0,dep:0,arrets:0,muret:0,vitesse:0};
      for(let g=1;g<=(pneus?1:GRAINES);g++){const e=creerCourseIA(r.c,10,pneus?4:3,g,r.carte);if(pneus&&r.c.stands)e.pilotes.forEach((p,k)=>{p.pilote.standTour=2+k%2;});rouler(e,pneus?4:3);const V=e.pilotes;
      const x_={fini:V.every(x=>x.arrivee!==null),chocs:chocs(V),herbe:somme(V,x=>x.herbe),barr:somme(V,x=>x.v.contactsBarriere),
        coupes:somme(V,x=>Math.round((x.course.penalites-(x.course.penaliteSansArret||0)-(x.course.penalitesStands||0))/REGLAGES.PENALITE_COUPE)),dep:e.depassements.length,
        arrets:somme(V,x=>(x.course.arrets||[]).length),muret:somme(V,x=>x.v.contactsMurStands),vitesse:somme(V,x=>x.course.penalitesStands||0)};
      for(const k in tot)tot[k]=k==='fini'?tot.fini&&x_.fini:tot[k]+x_[k];}
      r[pneus?'avec':'sans']=tot;
    }catch(err){r[pneus?'avec':'sans']={erreur:err.message};}finally{REGLAGES.PNEUS_ACTIFS=avant;}
  }
  // 5, 12 et 18 tours avec les pneus et la vraie stratégie (un arrêt obligatoire en 12 et 18, au tour que chacune choisit ; aucun en 5) :
  // EXIGÉ (tour 32, l'usure au mètre) : en 5 tours, personne ne finit avec des pneus morts ; en 12 et 18, chacune s'arrête une fois, et ni
  // les pneus enlevés à l'arrêt ni ceux de l'arrivée ne sont morts (un arrêt suffit)
  r.longues={};
  if(Q.get('douze')!=='0')for(const n of [5,12,18]){const avant=REGLAGES.PNEUS_ACTIFS;REGLAGES.PNEUS_ACTIFS=true;
    try{const e=rouler(creerCourseIA(r.c,10,n,1,r.carte),n),V=e.pilotes,usures=V.flatMap(x=>(x.course.arrets||[]).map(a=>a.usure).concat([x.v.pneus.usure]));
      r.longues[n]={fini:V.every(x=>x.arrivee!==null),chocs:chocs(V),herbe:somme(V,x=>x.herbe),barr:somme(V,x=>x.v.contactsBarriere),
        coupes:somme(V,x=>Math.round((x.course.penalites-(x.course.penaliteSansArret||0)-(x.course.penalitesStands||0))/REGLAGES.PENALITE_COUPE)),dep:e.depassements.length,
        arrets:somme(V,x=>(x.course.arrets||[]).length),unArret:V.every(x=>(x.course.arrets||[]).length===(n>=12?1:0)),muret:somme(V,x=>x.v.contactsMurStands),vitesse:somme(V,x=>x.course.penalitesStands||0),
        sans:V.filter(x=>x.course.penaliteSansArret>0).length,usure:Math.max(...usures)};}
    catch(err){r.longues[n]={erreur:err.message};}finally{REGLAGES.PNEUS_ACTIFS=avant;}
    const x=r.longues[n];
    t(`${def.nom} : ${n} tours avec les pneus : ${n>=12?'un arrêt chacune suffit (pneus jamais morts, ni à l’arrêt ni à l’arrivée)':'on finit sans arrêt, pneus jamais morts'}`,()=>v(!x.erreur&&x.fini&&x.unArret&&x.usure<REGLAGES_PNEUS.USURE_MAX,x.erreur||('usure maximale '+x.usure.toFixed(3)+', arrêts '+x.arrets+', toutes arrivées '+x.fini)));}
  const f=x=>x.erreur?'erreur '+x.erreur:`${x.fini?'toutes arrivées':'PAS TOUTES ARRIVÉES'}, chocs>5 ${x.chocs}, herbe ${x.herbe}, barrières ${x.barr}, coupes ${x.coupes}, dépassements ${x.dep}`;
  L.push(`  ${def.nom} (${(r.longueur/1000).toFixed(3)} km, ${r.virages} virages) : carte ${(r.msCarte/1000).toFixed(1)} s | seule : ${r.seule?(r.seule.tours.map(x=>x.toFixed(2)).join(' / ')+' s, barrières '+r.seule.barr+', herbe '+r.seule.herbe+', coupes '+r.seule.coupes):'—'}`);
  L.push(`      10 IA, 3 tours, sans pneus${GRAINES>1?' ('+GRAINES+' graines, totaux)':''} : ${f(r.sans)}`);
  if(r.avec)L.push(`      10 IA, 4 tours, pneus + arrêt au tour 2 ou 3 : ${f(r.avec)}${r.avec.erreur?'':', arrêts '+r.avec.arrets+'/10, muret '+r.avec.muret+', pénalités de vitesse '+r.avec.vitesse+' s'}${r.c.stands?'':' (pas de voie des stands)'}`);
  for(const n of Object.keys(r.longues)){const x=r.longues[n];L.push(`      10 IA, ${n} tours, pneus et stratégie : ${f(x)}${x.erreur?'':', arrêts '+x.arrets+'/10, sans arrêt '+x.sans+', muret '+x.muret+', pénalités de vitesse '+x.vitesse+' s, usure maximale '+x.usure.toFixed(2)}`);}
  ecrire(cle);
}
// le pont de Suzuko (tour 34, Chef) : la physique est plate, les deux passages du croisement ont les mêmes x, z. EXIGÉ : deux voitures
// de part et d'autre du croisement (branchesOpposees) ne se touchent pas, ne se voient pas, ne s'aspirent pas ; positionSurPiste garde
// sa branche (jamais de saut de s). 20 IA, 3 tours à Suzuko ; puis deux voitures posées l'une sur l'autre au croisement. ?pont=0 : sauté
if(Q.get('pont')!=='0'&&(!FILTRE||FILTRE.split(',').includes('suzuko'))){
  const SZ=construireCircuit(CIRCUITS_OFFICIELS_A.suzuko),CR=SZ.croisement;
  t('Suzuko : le croisement est dans le circuit, ses deux passages au même endroit (à moins de 3 m)',()=>{v(CR&&CR.length===2,'croisement '+CR);
    const i=Math.round(CR[0]/SZ.pas),j=Math.round(CR[1]/SZ.pas);let m=Infinity;
    for(let a=i-25;a<=i+25;a++)for(let b=j-25;b<=j+25;b++){const A=(a+SZ.nb)%SZ.nb,B=(b+SZ.nb)%SZ.nb;m=Math.min(m,Math.hypot(SZ.x[A]-SZ.x[B],SZ.z[A]-SZ.z[B]));}
    L.push('  (croisement '+CR.join(' / ')+' m : les deux passages à '+m.toFixed(2)+' m l’un de l’autre)');v(m<3,'écart '+m.toFixed(2)+' m');});
  t('Suzuko, 20 IA, 3 tours : aucun contact, aucune voiture vue, aucune aspiration entre les deux passages du croisement ; aucun saut de branche',()=>{
    const carte=carteDepuis(SZ,calculerTrajectoire(SZ)),e=creerCourseIA(SZ,20,3,1,carte),V=e.pilotes;
    let contacts=0,vues=0,aspi=0,sauts=0,rencontres=0;const avant=V.map(p_=>p_.v.piste.s);
    const pasMax=Math.round(3*REGLAGES.SIMULATION_TEMPS_MAX/DT);
    for(let k=0;k<pasMax&&e.arrives<V.length;k++){
      const enCourse=V.filter(p_=>p_.arrivee===null),voit=enCourse.map(p_=>p_.v);
      for(const p_ of enCourse)for(const w of voituresVues(p_.v,voit,SZ))if(branchesOpposees(SZ,p_.v.piste.s,w.s))vues++;
      pasCourseIA(e,DT);
      for(const p_ of enCourse){const a=p_.v;
        for(const w of a.touche||[])if(w.piste&&branchesOpposees(SZ,a.piste.s,w.piste.s))contacts++;
        for(const w of voit)if(w!==a&&branchesOpposees(SZ,a.piste.s,w.piste.s)&&Math.hypot(w.x-a.x,w.z-a.z)<8)rencontres++;
        if(a.aspiration>0)for(const w of voit){if(w===a||!branchesOpposees(SZ,a.piste.s,w.piste.s))continue;const c_=Math.cos(a.cap),s_=Math.sin(a.cap),dx=w.x-a.x,dz=w.z-a.z,av=c_*dx+s_*dz;
          if(av>REGLAGES.LONGUEUR_VOITURE&&av<REGLAGES.ASPIRATION_DISTANCE&&Math.abs(-s_*dx+c_*dz)<REGLAGES.ASPIRATION_LARGEUR)aspi++;}}
      V.forEach((p_,q)=>{if(!p_.v.piste)return;const d=Math.abs(ecartLeLong(SZ,p_.v.piste.s-avant[q]));if(d>20)sauts++;avant[q]=p_.v.piste.s;});}
    L.push('  (Suzuko, 20 IA, 3 tours : '+rencontres+' pas où deux voitures des deux passages étaient à moins de 8 m ; contacts '+contacts+', vues '+vues+', aspirations '+aspi+', sauts '+sauts+', arrivées '+e.arrives+'/20)');
    v(contacts===0&&vues===0&&aspi===0&&sauts===0,'contacts '+contacts+', vues '+vues+', aspirations '+aspi+', sauts '+sauts);v(e.arrives===20,'arrivées '+e.arrives);});
  t('Suzuko : deux voitures posées l’une sur l’autre au croisement (même x, z) ne se touchent pas, ne se voient pas, ne s’aspirent pas, et chacune garde sa branche (sans le croisement, elles se toucheraient)',()=>{
    const i=Math.round(CR[0]/SZ.pas),j0=Math.round(CR[1]/SZ.pas);let j=j0,m=Infinity;
    for(let b=j0-25;b<=j0+25;b++){const B=(b+SZ.nb)%SZ.nb,d_=Math.hypot(SZ.x[i]-SZ.x[B],SZ.z[i]-SZ.z[B]);if(d_<m){m=d_;j=B;}}
    const poser=circ=>{const a=creerVoiture(circ),b=creerVoiture(circ);placerSurPiste(a,circ,SZ.s[i],0);placerSurPiste(b,circ,SZ.s[j],0);
      b.x=a.x;b.z=a.z;b.piste=positionSurPiste(circ,b.x,b.z,b.piste.indice);a.u=b.u=40;return [a,b];};
    const [a,b]=poser(SZ),sa=a.piste.s,sb=b.piste.s;
    contactsVoitures([a,b],SZ);aspirationVoitures([a,b],SZ);
    const vuesAB=voituresVues(a,[a,b],SZ).length+voituresVues(b,[a,b],SZ).length;
    for(let k=0;k<60;k++){pasVoiture(a,SZ,DT);pasVoiture(b,SZ,DT);contactsVoitures([a,b],SZ);}
    v(a.contactsVoiture===0&&b.contactsVoiture===0,'contacts '+a.contactsVoiture+'/'+b.contactsVoiture);v(vuesAB===0,'vues '+vuesAB);v(a.aspiration===0&&b.aspiration===0,'aspiration');
    v(Math.abs(ecartLeLong(SZ,a.piste.s-sa))<30&&Math.abs(ecartLeLong(SZ,b.piste.s-sb))<30,'saut de branche : '+sa.toFixed(0)+' → '+a.piste.s.toFixed(0)+', '+sb.toFixed(0)+' → '+b.piste.s.toFixed(0));
    // la recherche complète (sans indice) au même point donne une des branches ; avec l'indice de l'autre, elle garde celle de l'indice
    const p2=positionSurPiste(SZ,b.x,b.z,(b.piste.indice+REGLAGES.FENETRE_RECHERCHE+3)%SZ.nb);v(Math.abs(ecartLeLong(SZ,p2.s-b.piste.s))<60,'recherche complète : '+b.piste.s.toFixed(0)+' → '+p2.s.toFixed(0));
    // le témoin : le même circuit sans croisement, elles se touchent
    const plat=Object.assign({},SZ,{croisement:null}),[a2,b2]=poser(plat);contactsVoitures([a2,b2],plat);v(a2.contactsVoiture===1,'le témoin sans croisement ne se touche pas : '+a2.contactsVoiture);
    L.push('  (posées au croisement : '+sa.toFixed(0)+' m et '+sb.toFixed(0)+' m, à '+m.toFixed(2)+' m ; 0 contact, 0 vue ; témoin sans croisement : '+a2.contactsVoiture+' contact)');});
  ecrire();
}
t('aucune erreur JavaScript',()=>v(__err.length===0,__err.join(' | ')));
ecrire();
</script></body></html>
