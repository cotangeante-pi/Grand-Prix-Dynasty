cript src="../messages.js"></script><script src="../commentaire.js"></script><script src="../decor.js"></script><script src="../fantome.js"></script><script src="../principal.js"></script>
<script>
const L=[];let ok=0,ko=0;
function t(n,f){try{f();ok++;L.push('✔ '+n);}catch(e){ko++;L.push('✘ '+n+' — '+e.message);}}
const v=(c,m)=>{if(!c)throw new Error(m||'faux');};
// le résultat s'écrit au fil de l'eau : si la page est coupée, #res montre jusqu'où elle est allée
function ecrire(etape){document.getElementById('res').textContent=`${etape?'EN COURS ('+etape+') ':''}RESULTAT ${ok}/${ok+ko}\n`+L.join('\n');}
// le calendrier du jeu (les 12 tracés, tour 32) est gardé à part et testé plus bas ; les tests du championnat, écrits avec les deux
// circuits d'essai en alternance (course de cœur « technique », GP 2 sur le technique…), gardent ce calendrier d'essai
const CALENDRIER_JEU=REGLAGES.CALENDRIER_CIRCUITS;REGLAGES.CALENDRIER_CIRCUITS=['test','technique'];
// de même, les tests du moteur sont écrits sans les pneus (PNEUS_ACTIFS, vrai dans le jeu depuis le tour 32) : ceux qui les veulent les
// allument (avecPneus) ; les courses avec les pneus sont mesurées dans courses.html, stands.html, consignes.html et officiels.html
REGLAGES.PNEUS_ACTIFS=false;

// --- les réglages
t('la physique avance par pas de 1/120 s', ()=>{v(REGLAGES.PAS_PHYSIQUE===1/120);});

// --- la boucle à rythme fixe
let pasVus=0; BOUCLE.surPhysique(()=>pasVus++);
// une seconde de temps réel découpée en images de 1/ips : combien de pas ?
function uneSeconde(ips){BOUCLE.arreter();pasVus=0;for(let i=0;i<ips;i++) BOUCLE.avancer(1/ips);return pasVus;}
for(const ips of [30,60,144,24,75,120,165,240])
  t(`1 s affichée à ${ips} images/s = exactement 120 pas`, ()=>{const n=uneSeconde(ips);v(n===120,n+' pas');});
t('10 s à 144 images/s = exactement 1200 pas (pas de dérive)', ()=>{BOUCLE.arreter();pasVus=0;for(let i=0;i<1440;i++) BOUCLE.avancer(1/144);v(pasVus===1200,pasVus+' pas');});
t('des images irrégulières donnent quand même 120 pas par seconde', ()=>{BOUCLE.arreter();pasVus=0;ALEATOIRE.semer(3);let total=0;
  while(total<0.999){const dt=Math.min(1-total,0.004+hasard()*0.03);BOUCLE.avancer(dt);total+=dt;} v(pasVus===120,pasVus+' pas');ALEATOIRE.semer();});
t('plafond : une image de 5 s ne fait que '+REGLAGES.PAS_MAX_PAR_IMAGE+' pas, et le retard est oublié', ()=>{BOUCLE.arreter();
  const n=BOUCLE.avancer(5);v(n===REGLAGES.PAS_MAX_PAR_IMAGE,n+' pas');v(BOUCLE.avancer(0)===0,'le retard revient à l’image suivante');});
t('simuler(1) = 120 pas, sans affichage', ()=>{let images=0;BOUCLE.surAffichage(()=>images++);pasVus=0;v(BOUCLE.simuler(1)===120);v(pasVus===120);v(images===0,'l’affichage a été appelé');});
t('simuler(60) = 7200 pas', ()=>{pasVus=0;BOUCLE.simuler(60);v(pasVus===7200,pasVus+' pas');});
t('l’onglet caché arrête la boucle, revenu il la relance', ()=>{BOUCLE.demarrer();v(BOUCLE.tourne,'pas démarrée');
  BOUCLE.changerVisibilite(true);v(!BOUCLE.tourne,'tourne encore onglet caché');
  BOUCLE.changerVisibilite(false);v(BOUCLE.tourne,'pas relancée');BOUCLE.arreter();v(!BOUCLE.tourne);});
t('arrêtée, la boucle ne repart pas quand l’onglet revient', ()=>{BOUCLE.arreter();BOUCLE.changerVisibilite(true);BOUCLE.changerVisibilite(false);v(!BOUCLE.tourne);});

// --- le circuit (calcul pur)
const C=CIRCUIT_TEST;
t('CIRCUIT_TEST fait entre 2,5 et 3,5 km', ()=>{v(C.longueur>2500&&C.longueur<3500,C.longueur+' m');});
t('la longueur est stable : échantillons à 1 m et à 2 m, moins de 0,5 % d’écart', ()=>{const c1=construireCircuit(CIRCUITS.test,1),c2=construireCircuit(CIRCUITS.test,2);
  const e=Math.abs(c1.longueur-c2.longueur)/c1.longueur;v(e<0.005,(e*100).toFixed(4)+' %');});
t('les échantillons sont régulièrement espacés (±1 %)', ()=>{let mn=Infinity,mx=0;for(let i=0;i<C.nb;i++){const k=(i+1)%C.nb,g=Math.hypot(C.x[k]-C.x[i],C.z[k]-C.z[i]);mn=Math.min(mn,g);mx=Math.max(mx,g);}
  v(mn>C.pas*0.99&&mx<C.pas*1.01,'écarts de '+mn.toFixed(3)+' à '+mx.toFixed(3)+' m');});
t('la piste ne se recoupe nulle part (deux morceaux éloignés le long de la courbe restent à plus d’une largeur)', ()=>{
  const loin=3*C.largeur;let pire=Infinity,ou='';
  for(let i=0;i<C.nb;i++) for(let j=i+1;j<C.nb;j++){const ds=Math.min(C.s[j]-C.s[i],C.longueur-(C.s[j]-C.s[i]));if(ds<loin) continue;
    const d=Math.hypot(C.x[i]-C.x[j],C.z[i]-C.z[j]);if(d<pire){pire=d;ou=i+'/'+j;}}
  v(pire>C.largeur,'deux morceaux à '+pire.toFixed(1)+' m ('+ou+')');});
t('aucun virage plus serré que la demi-largeur (le bord intérieur ne se replie pas)', ()=>{let k=0;for(let i=0;i<C.nb;i++) k=Math.max(k,Math.abs(C.courbure[i]));v(1/k>C.largeur/2,'rayon '+(1/k).toFixed(1)+' m');});
t('il y a un virage serré (rayon < 60 m) et des parties droites', ()=>{let k=0,droit=0;for(let i=0;i<C.nb;i++){k=Math.max(k,Math.abs(C.courbure[i]));if(Math.abs(C.courbure[i])<1e-4) droit++;}v(1/k<60,'rayon '+(1/k).toFixed(1));v(droit>C.nb/4,droit+' échantillons droits');});
t('la ligne d’arrivée est au départ, et s y vaut 0', ()=>{v(Math.hypot(C.x[0]-CIRCUITS.test.depart[0],C.z[0]-CIRCUITS.test.depart[1])<1e-6);v(C.s[0]===0);});
t('les morceaux se referment sur le départ (moins de 5 cm)', ()=>{v(C.fermeture<0.05,C.fermeture.toFixed(4)+' m');});
// la courbure dans chaque morceau, à 8 m de ses bouts (la spline et la différence finie débordent un peu sur le voisin)
const dans=(m,marge)=>{const r=[];for(let i=0;i<C.nb;i++) if(C.s[i]>m.debut+marge&&C.s[i]<m.fin-marge) r.push(C.courbure[i]);return r;};
t('sur les droites, |courbure| < 1/3000 par mètre', ()=>{let pire=0;for(const m of C.morceaux) if(m.type==='droite') for(const k of dans(m,8)) pire=Math.max(pire,Math.abs(k));
  L.push('  (pire courbure sur une droite : 1/'+(1/pire).toFixed(0)+' m)');v(pire<1/3000,'1/'+(1/pire).toFixed(0));});
t('dans un virage, la courbure ne change pas de signe, et c’est le bon', ()=>{for(const m of C.morceaux) if(m.type==='virage'){const ks=dans(m,8);v(ks.length>3);v(ks.every(k=>Math.sign(k)===m.angles[0]),'virage à '+m.debut.toFixed(0)+' m');}});
t('dans une chicane, la courbure change de signe deux fois', ()=>{const ch=C.morceaux.filter(m=>m.type==='chicane');v(ch.length===2);
  for(const m of ch){const ks=dans(m,1).filter(k=>Math.abs(k)>1/1000);let n=0;for(let i=1;i<ks.length;i++) if(Math.sign(ks[i])!==Math.sign(ks[i-1])) n++;v(n===2,n+' changements à '+m.debut.toFixed(0)+' m');v(Math.sign(ks[0])===m.angles[0]);}});
t('trois secteurs dans l’ordre', ()=>{v(C.secteurs.length===3&&C.secteurs[0]===0&&C.secteurs[1]<C.secteurs[2]&&C.secteurs[2]<C.longueur);});
const P=(x,z,i)=>positionSurPiste(C,x,z,i);
const proche=(a,b,e)=>Math.abs(a-b)<=e;
t('sur la ligne : s = 0, d = 0, sur la piste, secteur 1', ()=>{const p=P(0,0);v(proche(p.s,0,0.01)||proche(p.s,C.longueur,0.01),'s '+p.s);v(proche(p.d,0,0.01),'d '+p.d);v(p.surPiste&&p.secteur===1);});
t('au milieu de la droite des stands : s = 150', ()=>{const p=P(150,0);v(proche(p.s,150,0.05),'s '+p.s);v(proche(p.d,0,0.01));});
t('à droite du pilote : d > 0 ; à gauche : d < 0', ()=>{v(proche(P(150,5).d,5,0.01),'droite '+P(150,5).d);v(proche(P(150,-5).d,-5,0.01),'gauche '+P(150,-5).d);
  // la droite opposée se roule vers -x : la droite du pilote est vers -z
  v(proche(P(200,315).d,5,0.01),'droite opposée '+P(200,315).d);});
t('au bord : sur la piste ; un peu plus loin : dehors', ()=>{v(P(150,6.4).surPiste);v(P(150,-6.4).surPiste);v(!P(150,6.6).surPiste);v(!P(150,-30).surPiste);v(proche(P(150,-30).d,-30,0.01));});
t('juste avant la ligne : s presque égal à la longueur ; juste après : s presque 0', ()=>{const a=P(-1,0),b=P(1,0);v(proche(a.s,C.longueur-1,0.05),'avant '+a.s);v(proche(b.s,1,0.05),'après '+b.s);v(a.secteur===3&&b.secteur===1);});
t('un point de chaque secteur', ()=>{v(P(150,0).secteur===1);v(P(200,320).secteur===2,'droite opposée : '+P(200,320).secteur);v(P(-500,160).secteur===3,'petite droite : '+P(-500,160).secteur);});
t('chaque échantillon se retrouve à sa place (s, d = 0)', ()=>{for(let i=0;i<C.nb;i+=7){const p=P(C.x[i],C.z[i],i);v(proche(p.s,C.s[i],0.01)&&proche(p.d,0,0.01),'échantillon '+i+' : '+p.s+' / '+C.s[i]);}});
t('avec indiceDepart, même résultat que la recherche complète (2000 points au hasard près de la piste)', ()=>{ALEATOIRE.semer(11);
  for(let n=0;n<2000;n++){const i=Math.floor(hasard()*C.nb),d=(hasard()-0.5)*40,x=C.x[i]+C.nx[i]*d,z=C.z[i]+C.nz[i]*d;
    const depart=(i+Math.floor((hasard()-0.5)*10)+C.nb)%C.nb;const a=P(x,z,depart),b=P(x,z);
    v(proche(a.s,b.s,1e-6)&&proche(a.d,b.d,1e-6),'point '+n+' : '+a.s+'/'+b.s+' '+a.d+'/'+b.d);}ALEATOIRE.semer();});
t('un indiceDepart faux (à l’autre bout du circuit) est rattrapé par la recherche complète', ()=>{const p=P(150,0,Math.floor(C.nb/2));v(proche(p.s,150,0.05),'s '+p.s);});
let mesureVitesse='';
t('vitesse : 20 voitures × 120 pas = 2400 appels en moins de 2 ms (médiane sous 10 ms)', ()=>{
  // 20 voitures réparties sur le tour, à 72 m/s (0,6 m par pas), qui zigzaguent un peu
  const pts=[];ALEATOIRE.semer(5);
  for(let v_=0;v_<20;v_++){const s0=v_*C.longueur/20;for(let k=0;k<120;k++){const s=(s0+k*0.6)%C.longueur,i=Math.floor(s/C.pas),d=Math.sin(k/20+v_)*5;pts.push([C.x[i]+C.nx[i]*d,C.z[i]+C.nz[i]*d]);}}
  ALEATOIRE.semer();
  const temps=[];
  // 3 passages pour chauffer le compilateur JavaScript, puis 15 mesures. Le critère porte sur la meilleure :
  // les autres programmes du Mac ne peuvent que rallonger une mesure, jamais la raccourcir. La médiane est affichée aussi.
  for(let essai=-3;essai<15;essai++){const t0=performance.now();
    for(let v_=0;v_<20;v_++){let ind=null;for(let k=0;k<120;k++){const q=pts[v_*120+k];ind=positionSurPiste(C,q[0],q[1],ind).indice;}}
    if(essai>=0) temps.push(performance.now()-t0);}
  temps.sort((a,b)=>a-b);const med=temps[7];mesureVitesse='médiane '+med.toFixed(2)+' ms, meilleur '+temps[0].toFixed(2)+' ms ['+temps.map(x=>x.toFixed(1)).join(' ')+']';
  L.push('  ('+mesureVitesse+')');v(temps[0]<2,mesureVitesse);v(med<10,'garde-fou : médiane '+med.toFixed(2)+' ms');});
t('construction : longueur, échantillons, temps', ()=>{const t0=performance.now();const c=construireCircuit(CIRCUITS.test);const ms=performance.now()-t0;
  L.push('  (longueur '+c.longueur.toFixed(1)+' m, '+c.nb+' échantillons de '+c.pas.toFixed(3)+' m, construit en '+ms.toFixed(1)+' ms)');v(ms<200,ms+' ms');});

// --- la physique de la voiture
const DT=REGLAGES.PAS_PHYSIQUE, KMH=3.6;
function rouler(vo,circuit,secondes,commandes,chaquePas){const n=Math.round(secondes/DT);for(let k=0;k<n;k++){appliquerCommandes(vo,typeof commandes==='function'?commandes(vo,k):commandes);pasVoiture(vo,circuit,DT);if(chaquePas&&chaquePas(vo,k)===false) return k;}return n;}
t('0–100 km/h en 2,6 s environ (entre 2,3 et 2,9 s)', ()=>{const vo=creerVoiture(null);let k=0;while(vo.u<100/KMH&&k<2000){appliquerCommandes(vo,{gaz:1,frein:0,direction:0});pasVoiture(vo,null,DT);k++;}
  const t_=k*DT;L.push('  (0–100 : '+t_.toFixed(2)+' s)');v(t_>2.3&&t_<2.9,t_.toFixed(2)+' s');});
t('vitesse max ≈ 330 km/h (entre 320 et 340)', ()=>{const vo=creerVoiture(null);rouler(vo,null,60,{gaz:1,frein:0,direction:0});L.push('  (vitesse max : '+(vo.u*KMH).toFixed(1)+' km/h)');v(vo.u*KMH>320&&vo.u*KMH<340,(vo.u*KMH).toFixed(1));});
t('freinage de 300 à 80 km/h en 70 à 160 m', ()=>{const vo=creerVoiture(null);vo.u=300/KMH;let k=0;while(vo.u>80/KMH&&k<5000){appliquerCommandes(vo,{gaz:0,frein:1,direction:0});pasVoiture(vo,null,DT);k++;}
  const d=Math.hypot(vo.x,vo.z);L.push('  (300 → 80 km/h : '+d.toFixed(1)+' m en '+(k*DT).toFixed(2)+' s)');v(d>70&&d<160,d.toFixed(1)+' m');});
t('le frein arrête la voiture sans la faire reculer, puis la marche arrière est lente', ()=>{const vo=creerVoiture(null);vo.u=20;rouler(vo,null,3,{gaz:0,frein:1,direction:0});v(vo.u<=0&&vo.u>=-REGLAGES.MARCHE_ARRIERE_MAX-1e-9,String(vo.u));});
const ROND=construireCircuit({nom:'rond',largeur:13,secteurs:[0,0.34,0.67],depart:[0,0,0],morceaux:[['virage',100,360]]});
t('virage de 100 m à 80 % de la vitesse limite : la voiture tient le cercle à vitesse stable', ()=>{const vl=vitesseVirage(1/100),cible=0.8*vl;const vo=creerVoiture(ROND,0);
  let dMax=0,uMin=Infinity,uMax=0;rouler(vo,ROND,30,(v_)=>piloteRobot(v_,ROND,cible),(v_,k)=>{if(k*DT>20){dMax=Math.max(dMax,Math.abs(v_.piste.d));uMin=Math.min(uMin,v_.u);uMax=Math.max(uMax,v_.u);}});
  L.push('  (limite théorique à 100 m : '+(vl*KMH).toFixed(0)+' km/h ; à 80 % : écart au centre ≤ '+dMax.toFixed(2)+' m, vitesse '+(uMin*KMH).toFixed(1)+'–'+(uMax*KMH).toFixed(1)+' km/h)');
  v(dMax<3,'écart '+dMax.toFixed(2));v(uMax-uMin<cible*0.03,'vitesse instable');});
t('virage de 100 m à 125 % de la vitesse limite : la voiture ne tient plus la ligne (elle s’écarte de plus de 4 m)', ()=>{const cible=1.25*vitesseVirage(1/100);const vo=creerVoiture(ROND,0);vo.u=cible;let dMax=0;
  rouler(vo,ROND,10,(v_)=>piloteRobot(v_,ROND,cible),(v_)=>{dMax=Math.max(dMax,Math.abs(v_.piste.d));});L.push('  (à 125 % : écart max '+dMax.toFixed(2)+' m)');v(dMax>4,'écart max '+dMax.toFixed(2));});
t('l’herbe ralentit', ()=>{const a=creerVoiture(C,60,0),b=creerVoiture(C,60,12);rouler(a,C,4,{gaz:1,frein:0,direction:0});rouler(b,C,4,{gaz:1,frein:0,direction:0});
  v(b.surHerbe&&!a.surHerbe);L.push('  (4 s plein gaz : piste '+(a.u*KMH).toFixed(0)+' km/h, herbe '+(b.u*KMH).toFixed(0)+' km/h)');v(b.u<a.u*0.85,(a.u*KMH).toFixed(0)+' / '+(b.u*KMH).toFixed(0));});
// le lâcher de la direction (ordre 8 du tour 4)
function lacher(kmh){const vo=creerVoiture(null);vo.u=kmh/3.6;const tenir=()=>vo.u<kmh/3.6?1:0;
  for(let k=0;k<120;k++){lisserCommandes(vo,{gaz:tenir(),frein:0,direction:1},DT);pasVoiture(vo,null,DT);}
  const cap0=vo.cap;let tR=null,capMax=0;
  for(let j=0;j<600;j++){lisserCommandes(vo,{gaz:tenir(),frein:0,direction:0},DT);pasVoiture(vo,null,DT);if(tR===null&&Math.abs(vo.r)<0.05) tR=(j+1)*DT;capMax=Math.max(capMax,Math.abs(vo.cap-cap0));}
  return {tR,deg:capMax*180/Math.PI,r:vo.r};}
for(const kmh of [150,250]) t(`touche gardée 1 s à ${kmh} km/h puis lâchée : |r| < 0,05 rad/s en moins de 0,6 s, le cap tourne de moins de 8° de plus`, ()=>{const m=lacher(kmh);
  L.push(`  (${kmh} km/h : |r| < 0,05 en ${m.tR===null?'jamais':m.tR.toFixed(3)+' s'}, cap encore ${m.deg.toFixed(1)}° ; au tour 3 : tête-à-queue, 184°)`);v(m.tR!==null&&m.tR<0.6,String(m.tR));v(m.deg<8,m.deg.toFixed(1)+'°');v(Math.abs(m.r)<0.01);});
// l'herbe ne fait que ralentir (ordre 9 du tour 4)
function rayonA(kmh,herbe){const vo=creerVoiture(null);vo.u=kmh/3.6;vo.surHerbe=herbe;
  for(let k=0;k<120;k++){vo.surHerbe=herbe;appliquerCommandes(vo,{gaz:0,frein:0,direction:1});pasVoiture(vo,null,DT);vo.u=kmh/3.6;}return kmh/3.6/Math.abs(vo.r);}
t('sur l’herbe, on tourne presque aussi serré que sur la piste (à 80 km/h)', ()=>{const p=rayonA(80,false),h=rayonA(80,true);L.push('  (rayon à 80 km/h : piste '+p.toFixed(1)+' m, herbe '+h.toFixed(1)+' m)');v(h<p*1.2,p.toFixed(1)+' / '+h.toFixed(1));});
t('sur l’herbe à 250 km/h, plein gaz : sous 100 km/h en moins de 3 s, puis une vitesse limite vers 80–100 km/h', ()=>{const vo=creerVoiture(null);vo.u=250/3.6;let t100=null;
  for(let k=0;k<120*20;k++){vo.surHerbe=true;appliquerCommandes(vo,{gaz:1,frein:0,direction:0});pasVoiture(vo,null,DT);if(t100===null&&vo.u<100/3.6) t100=(k+1)*DT;}
  L.push('  (herbe : sous 100 km/h en '+(t100===null?'—':t100.toFixed(2)+' s')+', vitesse limite '+(vo.u*3.6).toFixed(0)+' km/h)');v(t100!==null&&t100<3,String(t100));v(vo.u*3.6>=75&&vo.u*3.6<=100,(vo.u*3.6).toFixed(0));});

function apresExtinction(e){jusquAvantExtinction(e,0);for(let k=0;k<Math.round(REGLAGES.DEPART_ROBOT_REACTION/DT)+1;k++) pasADeux(e,[]);}
t('2 joueurs : dans la course (conduireJoueur), les touches du joueur 1 lancent et font rouler sa voiture seulement : celle du joueur 2 reste immobile au bit près (u = 0, même position), et inversement ; Espace ne remet personne en piste, E et Entrée remettent chacun le sien', ()=>{
  JEU.deux={nbIA:0,nbTours:3};
  const essai=(codes,qui)=>{const e=courseADeux(0,3,21),[p1,p2]=DEUX_JOUEURS.joueurs(e),actif=qui===1?p1:p2,autre=qui===1?p2:p1;
    const x0=autre.v.x,z0=autre.v.z;apresExtinction(e);   // les feux sont éteints depuis 0,2 s, personne n'a appuyé
    v(p1.course.depart!==p2.course.depart&&p1.course.depart.humain&&p2.course.depart.humain,'deux états de départ');
    for(let k=0;k<4*120;k++) pasADeux(e,codes);   // 4 s plein gaz pour l'un
    v(actif.course.depart.lance!==null&&actif.course.depart.resultat!=='faux'&&actif.v.u>1,'J'+qui+' pas parti : u='+actif.v.u.toFixed(1)+' '+actif.course.depart.resultat);
    v(autre.course.depart.lance===null&&autre.v.u===0&&autre.v.x===x0&&autre.v.z===z0,'J'+(3-qui)+' a bougé : u='+autre.v.u+' lance='+autre.course.depart.lance);
    return e;};
  essai(['KeyW'],1);essai(['ArrowUp'],2);essai(['KeyW','KeyA','KeyD','KeyE'],1);essai(['ArrowUp','ArrowLeft','ArrowRight','Enter','ShiftRight'],2);   // (sans le frein : il gagnerait sur le gaz)
  // la remise en piste : chacun la sienne (E, Entrée) ; Espace ne fait rien (JEU.remettre est ignoré à deux)
  const e=courseADeux(0,3,21),[p1,p2]=DEUX_JOUEURS.joueurs(e);apresExtinction(e);for(let k=0;k<3*120;k++) pasADeux(e,['KeyW','ArrowUp']);
  // chacun est poussé sur l'herbe, à 5 m du bord (en deçà de la barrière) ; une remise en piste le ramène au milieu : un saut de largeur / 2 + 5 m en un pas, bien plus que sa vitesse × DT
  const loin=C.largeur/2+5,decaler=p=>{p.v.x+=loin*p.v.piste.nx;p.v.z+=loin*p.v.piste.nz;},pos=p=>[p.v.x,p.v.z],remis=(p,a)=>Math.hypot(p.v.x-a[0],p.v.z-a[1])>loin-3;
  decaler(p1);decaler(p2);let a1=pos(p1),a2=pos(p2);JEU.remettre=true;pasADeux(e,[]);
  v(!remis(p1,a1)&&!remis(p2,a2),'Espace a remis quelqu’un en piste');JEU.remettre=false;
  a1=pos(p1);a2=pos(p2);JEU.deuxCommandes[1].remettre=true;pasADeux(e,[]);v(remis(p1,a1)&&!remis(p2,a2),'E : J1 '+remis(p1,a1)+' J2 '+remis(p2,a2));
  a2=pos(p2);JEU.deuxCommandes[2].remettre=true;pasADeux(e,[]);v(remis(p2,a2),'Entrée : J2 pas remis');
  appuyer([]);JEU.deux=null;});

t('passer en accéléré : une course de 8 IA (2 tours) finie en regardant (2 pas par image) et la même finie en accéléré (ARRIVEE.accelerer, jusqu’à ×100 par image, coupée par le temps) dès la première arrivée donnent les mêmes places, les mêmes temps et les mêmes pénalités, au bit près ; accelerer s’arrête dès que tout le monde est arrivé', ()=>{

      else for(let i=0;i<2;i++){pasCourseIA(e,DT);k++;}}

  const a=jouer(false),b=jouer(true);

  v(JSON.stringify(a.final)===JSON.stringify(b.final),'classement différent');
  v(a.e.pilotes.every((p,k)=>p.arrivee===b.e.pilotes[k].arrivee&&p.course.penalites===b.e.pilotes[k].course.penalites),'temps ou pénalités différents');
  v(b.images<a.images/20,'pas assez accéléré : '+b.images+' images contre '+a.images);
  // la limite de temps : une horloge qui avance de 1 ms à chaque lecture coupe l'image après ARRIVEE_TRANCHE_MS lectures (tous les ARRIVEE_PAS_CONTROLE pas)
  const e=creerCourseIA(C,4,1,3,CARTES_T.test);let h=0;for(let k=0;k<30*120;k++)pasCourseIA(e,DT);
  const r=ARRIVEE.accelerer(e,()=>pasCourseIA(e,DT),1e6,5,0,()=>(h+=1));v(r.pas===5*R.ARRIVEE_PAS_CONTROLE&&!r.pret,'coupe : '+JSON.stringify(r));

  // la dernière voiture encore en course est immobilisée (posée à sa place à chaque pas)
  const x0=lente.v.x,z0=lente.v.z,cap0=lente.v.cap,bloquer=()=>{lente.v.x=x0;lente.v.z=z0;lente.v.cap=cap0;lente.v.u=0;lente.v.v=0;lente.v.r=0;};

  // le rejeu : à 30 images par seconde, toujours dans une plage, jusqu'au bout ; puis fini

  COMMENTAIRE.pousser(c,0,'meilleurTour',{qui:0},false);COMMENTAIRE.pousser(c,0,'depassementTete',{qui:1,sur:0},false);
  v(COMMENTAIRE.afficher(c,0,false).type==='depassementTete','la tête passe devant');
  v(COMMENTAIRE.afficher(c,R.COMMENTAIRE_INTERVALLE-0.01,false)===null,'l’intervalle');
  v(COMMENTAIRE.afficher(c,R.COMMENTAIRE_INTERVALLE,true)===null,'l’attente au virage');
  v(COMMENTAIRE.afficher(c,R.COMMENTAIRE_INTERVALLE,false).type==='meilleurTour','puis le meilleur tour');
  COMMENTAIRE.pousser(c,15,'depassement',{qui:2,sur:3},false);COMMENTAIRE.pousser(c,15,'stands',{qui:4},true);   // (dits à 20 : moins de COMMENTAIRE_PEREMPTION s plus tard)
  v(COMMENTAIRE.afficher(c,20,false).type==='stands','un fait du joueur passe devant');
  COMMENTAIRE.pousser(c,20,'erreur',{qui:5},false);v(COMMENTAIRE.afficher(c,20+R.COMMENTAIRE_PEREMPTION+R.COMMENTAIRE_INTERVALLE+0.5,false)===null,'un fait trop vieux est oublié');
  let t0=100,avant=null,deuxFois=false;for(let i=0;i<30;i++){COMMENTAIRE.pousser(c,t0,'stands',{qui:i%5},false);const it=COMMENTAIRE.afficher(c,t0,false);const cle=it.type+':'+it.variante;if(cle===avant)deuxFois=true;avant=cle;t0+=R.COMMENTAIRE_INTERVALLE;}
  v(!deuxFois,'jamais la même phrase deux fois de suite');
  const mode=R.COMMENTAIRE_MODE;try{R.COMMENTAIRE_MODE='non';const d=COMMENTAIRE.creer(2);COMMENTAIRE.pousser(d,0,'arrivee',{qui:0},false);v(d.file.length===0&&COMMENTAIRE.afficher(d,0,false)===null,'coupé : rien');
    R.COMMENTAIRE_MODE='joueur';const f=COMMENTAIRE.creer(3);COMMENTAIRE.pousser(f,0,'depassement',{qui:1,sur:2},false);COMMENTAIRE.pousser(f,0,'penalite',{qui:0,s:5},true);COMMENTAIRE.pousser(f,0,'arrivee',{qui:3},false);
    v(f.file.map(x=>x.type).sort().join()==='arrivee,penalite','mode joueur : '+f.file.map(x=>x.type).join());}finally{R.COMMENTAIRE_MODE=mode;}});
// --- la réalisation télé (regie.js)
function tourRegie(nom){const R=REGLAGES,c=construireCircuit(CIRCUITS[nom]),choix=DECOR.pour(c,nom,null),obst=REGIE.obstacles(DECOR.placer(c,choix.description).objets),postes=REGIE.postes(c),r=REGIE.creer(c,postes,obst),copie=JSON.stringify(postes);
  const plans=[];let cache=0,n=0,helico=[999,-999],bouge=false,t=0;
  for(let s=0;s<c.longueur;s+=6){t+=0.1;const i=Math.round(s/c.pas)%c.nb,cible={x:c.x[i],z:c.z[i],cap:Math.atan2(c.tz[i],c.tx[i]),u:60,s,d:0},p=REGIE.choisir(r,t,cible);n++;
    if(!plans.length||plans[plans.length-1].poste!==p.poste)plans.push({poste:p.poste,t});
    if(!REGIE.voit(r,p,{x:cible.x,y:R.TELE_VISEE,z:cible.z}))cache++;
    if(p.genre==='helico'){helico[0]=Math.min(helico[0],p.y);helico[1]=Math.max(helico[1],p.y);}
    else if(p.x!==postes[p.poste].x||p.y!==postes[p.poste].y||p.z!==postes[p.poste].z)bouge=true;}
  const courts=plans.slice(0,-1).filter((q,k)=>plans[k+1].t-q.t<R.TELE_PLAN_MIN-1e-9).length;
  return{n,cache,courts,plans:plans.length,helico,bouge,postes:postes.length,fixes:JSON.stringify(postes)===copie,obstacles:obst.length};}
t('réalisation télé : sur un tour du circuit test et de Monoco, la caméra choisie voit toujours la voiture (aucun objet du décor sur la ligne de visée), un plan dure au moins TELE_PLAN_MIN, un poste ne bouge jamais, l’hélicoptère reste dans ses hauteurs', ()=>{
  const R=REGLAGES;
  for(const nom of ['test','monoco']){const m=tourRegie(nom);
    v(m.cache===0,nom+' : voiture cachée '+m.cache+' fois sur '+m.n);
    v(m.courts===0,nom+' : plans trop courts '+m.courts+' sur '+m.plans);
    v(!m.bouge&&m.fixes,nom+' : un poste a bougé');
    v(m.helico[0]===999||(m.helico[0]>=R.TELE_HELICO_HAUTEUR[0]&&m.helico[1]<=R.TELE_HELICO_HAUTEUR[1]),nom+' : hélicoptère à '+m.helico);
    v(m.postes>=8&&m.plans>=4&&m.obstacles>50,nom+' : '+JSON.stringify(m));}});
t('réalisation télé : la visée est coupée par un immeuble entre la caméra et la voiture, pas par un immeuble à côté ni par celui où la caméra est posée (son toit)', ()=>{
  const c=construireCircuit(CIRCUITS.test),r=REGIE.creer(c,[],[{cx:50,cz:0,rayon:10,h:30},{cx:0,cz:40,rayon:10,h:30}]),a={x:0,y:12,z:0},b={x:100,y:0.6,z:0};
  v(!REGIE.voit(r,a,b),'coupée par l’immeuble entre les deux');
  v(REGIE.voit(r,a,{x:0,y:0.6,z:-60}),'pas par un immeuble à côté');
  v(REGIE.voit(r,{x:0,y:40,z:40},{x:0,y:0.6,z:100}),'pas par le toit où elle est posée');
  v(REGIE.voit(r,{x:0,y:200,z:-200},b),'de très haut, par-dessus');});

t('commentateur du résumé vidéo : une phrase par moment fort (départ, dépassement, sortie, arrêt au stand, arrivée), celle du joueur pour son dépassement, le même réglage (coupé : rien ; tes faits : seulement les siens et l’arrivée), jamais deux fois la même de suite', ()=>{
  const R=REGLAGES,c=COMMENTAIRE.creer(3),types=['depart','depassement','sortie','arret','arrivee'].map(ty=>{const it=COMMENTAIRE.momentResume(c,{type:ty,qui:1,sur:2,place:3},0,'à Monoco');return it&&it.type;});
  v(types.join()==='depart,depassement,erreur,stands,arrivee',types.join());
  v(COMMENTAIRE.momentResume(c,{type:'depassement',qui:0,sur:2,place:3},0,'').type==='depassementJoueur','le dépassement du joueur');
  v(COMMENTAIRE.phrase(COMMENTAIRE.momentResume(c,{type:'depart',qui:1},0,'à Monoco'),k=>'n°'+(k+1),x=>x).indexOf('{')<0,'phrase remplie');
  let avant=null,deux=false;for(let i=0;i<20;i++){const it=COMMENTAIRE.momentResume(c,{type:'depassement',qui:1,sur:2,place:3},0,'');const k=it.type+':'+it.variante;if(k===avant)deux=true;avant=k;}v(!deux,'jamais deux fois de suite');
  const mode=R.COMMENTAIRE_MODE;try{R.COMMENTAIRE_MODE='non';v(COMMENTAIRE.momentResume(c,{type:'depart',qui:1},0,'')===null,'coupé');
    R.COMMENTAIRE_MODE='joueur';v(COMMENTAIRE.momentResume(c,{type:'depassement',qui:1,sur:2},0,'')===null&&COMMENTAIRE.momentResume(c,{type:'sortie',qui:0},0,'')!==null&&COMMENTAIRE.momentResume(c,{type:'arrivee',qui:4},0,'')!==null,'tes faits');}finally{R.COMMENTAIRE_MODE=mode;}});

t('aucune erreur JavaScript', ()=>{v(__err.length===0,__err.join(' | '));});
ecrire();
