<script src="../donnees.js"></script><script src="../textes.js"></script><script src="../aleatoire.js"></script><script src="../boucle.js"></script><script src="../circuits.js"></script><script src="../physique.js"></script><script src="../boite.js"></script><script src="../son.js"></script><script src="../camera.js"></script><script src="../robot.js"></script><script src="../ia.js"></script><script src="../simulation.js"></script><script src="../depart.js"></script><script src="../course.js"></script><script src="../arrivee.js"></script><script src="../qualification.js"></script><script src="../sauvegarde.js"></script><script src="../championnat.js"></script><script src="../decouverte.js"></script><script src="../pilote.js"></script><script src="../deux-joueurs.js"></script><script src="../casque.js"></script><script src="../cache-carte.js"></script><script src="../journal.js"></script><script src="../argent.js"></script><script src="../garage.js"></script><script src="../saisons.js"></script><script src="../sponsors.js"></script><script src="../fiche.js"></script><script src="../interview.js"></script><script src="../pneus-donnees.js"></script><script src="../pneus.js"></script><script src="../enregistreur-donnees.js"></script><script src="../enregistreur.js"></script><script src="../fantome.js"></script><script src="../principal.js"></script>
<script>
const L=[];let ok=0,ko=0;
function t(n,f){try{f();ok++;L.push('✔ '+n);}catch(e){ko++;L.push('✘ '+n+' — '+e.message);}}
const v=(c,m)=>{if(!c)throw new Error(m||'faux');};
// le résultat s'écrit au fil de l'eau : si la page est coupée, #res montre jusqu'où elle est allée
function ecrire(etape){document.getElementById('res').textContent=`${etape?'EN COURS ('+etape+') ':''}RESULTAT ${ok}/${ok+ko}\n`+L.join('\n');}

// --- les réglages
t('la physique avance par pas de 1/120 s', ()=>{v(REGLAGES.PAS_PHYSIQUE===1/120);});

// --- la boucle à rythme fixe
let pasVus=0; BOUCLE.surPhysique(()=>pasVus++);
// une seconde de temps réel découpée en images de 1/ips : combien de pas ?
function uneSeconde(ips){BOUCLE.arreter();pasVus=0;for(let i=0;i<ips;i++) BOUCLE.avancer(1/ips);return pasVus;}
for(const ips of [30,60,144,24,75,120,165,240])
  t(`1 s affichée à ${ips} images/s = exactement 120 pas`, ()=>{const n=uneSeconde(ips);v(n===120,n+' pas');});
t('10 s à 144 images/s = exactement 1200 pas (pas de dérive)', ()=>{BOUCLE.arreter();pasVus=0;for(let i=0;i<1440;i++) BOUCLE.avancer(1/144);v(pasVus===1200,pasVus+' pas');});
t('des images irrégulières donnent quand même 120 pas par seconde', ()=>{BOUCLE.arreter();pasVus=0;ALEATOIRE.semer(3);let total=0;
  while(total<0.999){const dt=Math.min(1-total,0.004+hasard()*0.03);BOUCLE.avancer(dt);total+=dt;} v(pasVus===120,pasVus+' pas');ALEATOIRE.semer();});
t('plafond : une image de 5 s ne fait que '+REGLAGES.PAS_MAX_PAR_IMAGE+' pas, et le retard est oublié', ()=>{BOUCLE.arreter();
  const n=BOUCLE.avancer(5);v(n===REGLAGES.PAS_MAX_PAR_IMAGE,n+' pas');v(BOUCLE.avancer(0)===0,'le retard revient à l’image suivante');});
t('simuler(1) = 120 pas, sans affichage', ()=>{let images=0;BOUCLE.surAffichage(()=>images++);pasVus=0;v(BOUCLE.simuler(1)===120);v(pasVus===120);v(images===0,'l’affichage a été appelé');});
t('simuler(60) = 7200 pas', ()=>{pasVus=0;BOUCLE.simuler(60);v(pasVus===7200,pasVus+' pas');});
t('l’onglet caché arrête la boucle, revenu il la relance', ()=>{BOUCLE.demarrer();v(BOUCLE.tourne,'pas démarrée');
  BOUCLE.changerVisibilite(true);v(!BOUCLE.tourne,'tourne encore onglet caché');
  BOUCLE.changerVisibilite(false);v(BOUCLE.tourne,'pas relancée');BOUCLE.arreter();v(!BOUCLE.tourne);});
t('arrêtée, la boucle ne repart pas quand l’onglet revient', ()=>{BOUCLE.arreter();BOUCLE.changerVisibilite(true);BOUCLE.changerVisibilite(false);v(!BOUCLE.tourne);});

// --- le circuit (calcul pur)
const C=CIRCUIT_TEST;
t('CIRCUIT_TEST fait entre 2,5 et 3,5 km', ()=>{v(C.longueur>2500&&C.longueur<3500,C.longueur+' m');});
t('la longueur est stable : échantillons à 1 m et à 2 m, moins de 0,5 % d’écart', ()=>{const c1=construireCircuit(CIRCUITS.test,1),c2=construireCircuit(CIRCUITS.test,2);
  const e=Math.abs(c1.longueur-c2.longueur)/c1.longueur;v(e<0.005,(e*100).toFixed(4)+' %');});
t('les échantillons sont régulièrement espacés (±1 %)', ()=>{let mn=Infinity,mx=0;for(let i=0;i<C.nb;i++){const k=(i+1)%C.nb,g=Math.hypot(C.x[k]-C.x[i],C.z[k]-C.z[i]);mn=Math.min(mn,g);mx=Math.max(mx,g);}
  v(mn>C.pas*0.99&&mx<C.pas*1.01,'écarts de '+mn.toFixed(3)+' à '+mx.toFixed(3)+' m');});
t('la piste ne se recoupe nulle part (deux morceaux éloignés le long de la courbe restent à plus d’une largeur)', ()=>{
  const loin=3*C.largeur;let pire=Infinity,ou='';
  for(let i=0;i<C.nb;i++) for(let j=i+1;j<C.nb;j++){const ds=Math.min(C.s[j]-C.s[i],C.longueur-(C.s[j]-C.s[i]));if(ds<loin) continue;
    const d=Math.hypot(C.x[i]-C.x[j],C.z[i]-C.z[j]);if(d<pire){pire=d;ou=i+'/'+j;}}
  v(pire>C.largeur,'deux morceaux à '+pire.toFixed(1)+' m ('+ou+')');});
t('aucun virage plus serré que la demi-largeur (le bord intérieur ne se replie pas)', ()=>{let k=0;for(let i=0;i<C.nb;i++) k=Math.max(k,Math.abs(C.courbure[i]));v(1/k>C.largeur/2,'rayon '+(1/k).toFixed(1)+' m');});
t('il y a un virage serré (rayon < 60 m) et des parties droites', ()=>{let k=0,droit=0;for(let i=0;i<C.nb;i++){k=Math.max(k,Math.abs(C.courbure[i]));if(Math.abs(C.courbure[i])<1e-4) droit++;}v(1/k<60,'rayon '+(1/k).toFixed(1));v(droit>C.nb/4,droit+' échantillons droits');});
t('la ligne d’arrivée est au départ, et s y vaut 0', ()=>{v(Math.hypot(C.x[0]-CIRCUITS.test.depart[0],C.z[0]-CIRCUITS.test.depart[1])<1e-6);v(C.s[0]===0);});
t('les morceaux se referment sur le départ (moins de 5 cm)', ()=>{v(C.fermeture<0.05,C.fermeture.toFixed(4)+' m');});
// la courbure dans chaque morceau, à 8 m de ses bouts (la spline et la différence finie débordent un peu sur le voisin)
const dans=(m,marge)=>{const r=[];for(let i=0;i<C.nb;i++) if(C.s[i]>m.debut+marge&&C.s[i]<m.fin-marge) r.push(C.courbure[i]);return r;};
t('sur les droites, |courbure| < 1/3000 par mètre', ()=>{let pire=0;for(const m of C.morceaux) if(m.type==='droite') for(const k of dans(m,8)) pire=Math.max(pire,Math.abs(k));
  L.push('  (pire courbure sur une droite : 1/'+(1/pire).toFixed(0)+' m)');v(pire<1/3000,'1/'+(1/pire).toFixed(0));});
t('dans un virage, la courbure ne change pas de signe, et c’est le bon', ()=>{for(const m of C.morceaux) if(m.type==='virage'){const ks=dans(m,8);v(ks.length>3);v(ks.every(k=>Math.sign(k)===m.angles[0]),'virage à '+m.debut.toFixed(0)+' m');}});
t('dans une chicane, la courbure change de signe deux fois', ()=>{const ch=C.morceaux.filter(m=>m.type==='chicane');v(ch.length===2);
  for(const m of ch){const ks=dans(m,1).filter(k=>Math.abs(k)>1/1000);let n=0;for(let i=1;i<ks.length;i++) if(Math.sign(ks[i])!==Math.sign(ks[i-1])) n++;v(n===2,n+' changements à '+m.debut.toFixed(0)+' m');v(Math.sign(ks[0])===m.angles[0]);}});
t('trois secteurs dans l’ordre', ()=>{v(C.secteurs.length===3&&C.secteurs[0]===0&&C.secteurs[1]<C.secteurs[2]&&C.secteurs[2]<C.longueur);});
const P=(x,z,i)=>positionSurPiste(C,x,z,i);
const proche=(a,b,e)=>Math.abs(a-b)<=e;
t('sur la ligne : s = 0, d = 0, sur la piste, secteur 1', ()=>{const p=P(0,0);v(proche(p.s,0,0.01)||proche(p.s,C.longueur,0.01),'s '+p.s);v(proche(p.d,0,0.01),'d '+p.d);v(p.surPiste&&p.secteur===1);});
t('au milieu de la droite des stands : s = 150', ()=>{const p=P(150,0);v(proche(p.s,150,0.05),'s '+p.s);v(proche(p.d,0,0.01));});
t('à droite du pilote : d > 0 ; à gauche : d < 0', ()=>{v(proche(P(150,5).d,5,0.01),'droite '+P(150,5).d);v(proche(P(150,-5).d,-5,0.01),'gauche '+P(150,-5).d);
  // la droite opposée se roule vers -x : la droite du pilote est vers -z
  v(proche(P(200,315).d,5,0.01),'droite opposée '+P(200,315).d);});
t('au bord : sur la piste ; un peu plus loin : dehors', ()=>{v(P(150,6.4).surPiste);v(P(150,-6.4).surPiste);v(!P(150,6.6).surPiste);v(!P(150,-30).surPiste);v(proche(P(150,-30).d,-30,0.01));});
t('juste avant la ligne : s presque égal à la longueur ; juste après : s presque 0', ()=>{const a=P(-1,0),b=P(1,0);v(proche(a.s,C.longueur-1,0.05),'avant '+a.s);v(proche(b.s,1,0.05),'après '+b.s);v(a.secteur===3&&b.secteur===1);});
t('un point de chaque secteur', ()=>{v(P(150,0).secteur===1);v(P(200,320).secteur===2,'droite opposée : '+P(200,320).secteur);v(P(-500,160).secteur===3,'petite droite : '+P(-500,160).secteur);});
t('chaque échantillon se retrouve à sa place (s, d = 0)', ()=>{for(let i=0;i<C.nb;i+=7){const p=P(C.x[i],C.z[i],i);v(proche(p.s,C.s[i],0.01)&&proche(p.d,0,0.01),'échantillon '+i+' : '+p.s+' / '+C.s[i]);}});
t('avec indiceDepart, même résultat que la recherche complète (2000 points au hasard près de la piste)', ()=>{ALEATOIRE.semer(11);
  for(let n=0;n<2000;n++){const i=Math.floor(hasard()*C.nb),d=(hasard()-0.5)*40,x=C.x[i]+C.nx[i]*d,z=C.z[i]+C.nz[i]*d;
    const depart=(i+Math.floor((hasard()-0.5)*10)+C.nb)%C.nb;const a=P(x,z,depart),b=P(x,z);
    v(proche(a.s,b.s,1e-6)&&proche(a.d,b.d,1e-6),'point '+n+' : '+a.s+'/'+b.s+' '+a.d+'/'+b.d);}ALEATOIRE.semer();});
t('un indiceDepart faux (à l’autre bout du circuit) est rattrapé par la recherche complète', ()=>{const p=P(150,0,Math.floor(C.nb/2));v(proche(p.s,150,0.05),'s '+p.s);});
let mesureVitesse='';
t('vitesse : 20 voitures × 120 pas = 2400 appels en moins de 2 ms (médiane sous 10 ms)', ()=>{
  // 20 voitures réparties sur le tour, à 72 m/s (0,6 m par pas), qui zigzaguent un peu
  const pts=[];ALEATOIRE.semer(5);
  for(let v_=0;v_<20;v_++){const s0=v_*C.longueur/20;for(let k=0;k<120;k++){const s=(s0+k*0.6)%C.longueur,i=Math.floor(s/C.pas),d=Math.sin(k/20+v_)*5;pts.push([C.x[i]+C.nx[i]*d,C.z[i]+C.nz[i]*d]);}}
  ALEATOIRE.semer();
  const temps=[];
  // 3 passages pour chauffer le compilateur JavaScript, puis 15 mesures. Le critère porte sur la meilleure :
  // les autres programmes du Mac ne peuvent que rallonger une mesure, jamais la raccourcir. La médiane est affichée aussi.
  for(let essai=-3;essai<15;essai++){const t0=performance.now();
    for(let v_=0;v_<20;v_++){let ind=null;for(let k=0;k<120;k++){const q=pts[v_*120+k];ind=positionSurPiste(C,q[0],q[1],ind).indice;}}
    if(essai>=0) temps.push(performance.now()-t0);}
  temps.sort((a,b)=>a-b);const med=temps[7];mesureVitesse='médiane '+med.toFixed(2)+' ms, meilleur '+temps[0].toFixed(2)+' ms ['+temps.map(x=>x.toFixed(1)).join(' ')+']';
  L.push('  ('+mesureVitesse+')');v(temps[0]<2,mesureVitesse);v(med<10,'garde-fou : médiane '+med.toFixed(2)+' ms');});
t('construction : longueur, échantillons, temps', ()=>{const t0=performance.now();const c=construireCircuit(CIRCUITS.test);const ms=performance.now()-t0;
  L.push('  (longueur '+c.longueur.toFixed(1)+' m, '+c.nb+' échantillons de '+c.pas.toFixed(3)+' m, construit en '+ms.toFixed(1)+' ms)');v(ms<200,ms+' ms');});

// --- la physique de la voiture
const DT=REGLAGES.PAS_PHYSIQUE, KMH=3.6;
function rouler(vo,circuit,secondes,commandes,chaquePas){const n=Math.round(secondes/DT);for(let k=0;k<n;k++){appliquerCommandes(vo,typeof commandes==='function'?commandes(vo,k):commandes);pasVoiture(vo,circuit,DT);if(chaquePas&&chaquePas(vo,k)===false) return k;}return n;}
t('0–100 km/h en 2,6 s environ (entre 2,3 et 2,9 s)', ()=>{const vo=creerVoiture(null);let k=0;while(vo.u<100/KMH&&k<2000){appliquerCommandes(vo,{gaz:1,frein:0,direction:0});pasVoiture(vo,null,DT);k++;}
  const t_=k*DT;L.push('  (0–100 : '+t_.toFixed(2)+' s)');v(t_>2.3&&t_<2.9,t_.toFixed(2)+' s');});
t('vitesse max ≈ 330 km/h (entre 320 et 340)', ()=>{const vo=creerVoiture(null);rouler(vo,null,60,{gaz:1,frein:0,direction:0});L.push('  (vitesse max : '+(vo.u*KMH).toFixed(1)+' km/h)');v(vo.u*KMH>320&&vo.u*KMH<340,(vo.u*KMH).toFixed(1));});
t('freinage de 300 à 80 km/h en 70 à 160 m', ()=>{const vo=creerVoiture(null);vo.u=300/KMH;let k=0;while(vo.u>80/KMH&&k<5000){appliquerCommandes(vo,{gaz:0,frein:1,direction:0});pasVoiture(vo,null,DT);k++;}
  const d=Math.hypot(vo.x,vo.z);L.push('  (300 → 80 km/h : '+d.toFixed(1)+' m en '+(k*DT).toFixed(2)+' s)');v(d>70&&d<160,d.toFixed(1)+' m');});
t('le frein arrête la voiture sans la faire reculer, puis la marche arrière est lente', ()=>{const vo=creerVoiture(null);vo.u=20;rouler(vo,null,3,{gaz:0,frein:1,direction:0});v(vo.u<=0&&vo.u>=-REGLAGES.MARCHE_ARRIERE_MAX-1e-9,String(vo.u));});
const ROND=construireCircuit({nom:'rond',largeur:13,secteurs:[0,0.34,0.67],depart:[0,0,0],morceaux:[['virage',100,360]]});
t('virage de 100 m à 80 % de la vitesse limite : la voiture tient le cercle à vitesse stable', ()=>{const vl=vitesseVirage(1/100),cible=0.8*vl;const vo=creerVoiture(ROND,0);
  let dMax=0,uMin=Infinity,uMax=0;rouler(vo,ROND,30,(v_)=>piloteRobot(v_,ROND,cible),(v_,k)=>{if(k*DT>20){dMax=Math.max(dMax,Math.abs(v_.piste.d));uMin=Math.min(uMin,v_.u);uMax=Math.max(uMax,v_.u);}});
  L.push('  (limite théorique à 100 m : '+(vl*KMH).toFixed(0)+' km/h ; à 80 % : écart au centre ≤ '+dMax.toFixed(2)+' m, vitesse '+(uMin*KMH).toFixed(1)+'–'+(uMax*KMH).toFixed(1)+' km/h)');
  v(dMax<3,'écart '+dMax.toFixed(2));v(uMax-uMin<cible*0.03,'vitesse instable');});
t('virage de 100 m à 125 % de la vitesse limite : la voiture ne tient plus la ligne (elle s’écarte de plus de 4 m)', ()=>{const cible=1.25*vitesseVirage(1/100);const vo=creerVoiture(ROND,0);vo.u=cible;let dMax=0;
  rouler(vo,ROND,10,(v_)=>piloteRobot(v_,ROND,cible),(v_)=>{dMax=Math.max(dMax,Math.abs(v_.piste.d));});L.push('  (à 125 % : écart max '+dMax.toFixed(2)+' m)');v(dMax>4,'écart max '+dMax.toFixed(2));});
t('l’herbe ralentit', ()=>{const a=creerVoiture(C,60,0),b=creerVoiture(C,60,12);rouler(a,C,4,{gaz:1,frein:0,direction:0});rouler(b,C,4,{gaz:1,frein:0,direction:0});
  v(b.surHerbe&&!a.surHerbe);L.push('  (4 s plein gaz : piste '+(a.u*KMH).toFixed(0)+' km/h, herbe '+(b.u*KMH).toFixed(0)+' km/h)');v(b.u<a.u*0.85,(a.u*KMH).toFixed(0)+' / '+(b.u*KMH).toFixed(0));});
// le lâcher de la direction (ordre 8 du tour 4)
function lacher(kmh){const vo=creerVoiture(null);vo.u=kmh/3.6;const tenir=()=>vo.u<kmh/3.6?1:0;
  for(let k=0;k<120;k++){lisserCommandes(vo,{gaz:tenir(),frein:0,direction:1},DT);pasVoiture(vo,null,DT);}
  const cap0=vo.cap;let tR=null,capMax=0;
  for(let j=0;j<600;j++){lisserCommandes(vo,{gaz:tenir(),frein:0,direction:0},DT);pasVoiture(vo,null,DT);if(tR===null&&Math.abs(vo.r)<0.05) tR=(j+1)*DT;capMax=Math.max(capMax,Math.abs(vo.cap-cap0));}
  return {tR,deg:capMax*180/Math.PI,r:vo.r};}
for(const kmh of [150,250]) t(`touche gardée 1 s à ${kmh} km/h puis lâchée : |r| < 0,05 rad/s en moins de 0,6 s, le cap tourne de moins de 8° de plus`, ()=>{const m=lacher(kmh);
  L.push(`  (${kmh} km/h : |r| < 0,05 en ${m.tR===null?'jamais':m.tR.toFixed(3)+' s'}, cap encore ${m.deg.toFixed(1)}° ; au tour 3 : tête-à-queue, 184°)`);v(m.tR!==null&&m.tR<0.6,String(m.tR));v(m.deg<8,m.deg.toFixed(1)+'°');v(Math.abs(m.r)<0.01);});
// l'herbe ne fait que ralentir (ordre 9 du tour 4)
function rayonA(kmh,herbe){const vo=creerVoiture(null);vo.u=kmh/3.6;vo.surHerbe=herbe;
  for(let k=0;k<120;k++){vo.surHerbe=herbe;appliquerCommandes(vo,{gaz:0,frein:0,direction:1});pasVoiture(vo,null,DT);vo.u=kmh/3.6;}return kmh/3.6/Math.abs(vo.r);}
t('sur l’herbe, on tourne presque aussi serré que sur la piste (à 80 km/h)', ()=>{const p=rayonA(80,false),h=rayonA(80,true);L.push('  (rayon à 80 km/h : piste '+p.toFixed(1)+' m, herbe '+h.toFixed(1)+' m)');v(h<p*1.2,p.toFixed(1)+' / '+h.toFixed(1));});
t('sur l’herbe à 250 km/h, plein gaz : sous 100 km/h en moins de 3 s, puis une vitesse limite vers 80–100 km/h', ()=>{const vo=creerVoiture(null);vo.u=250/3.6;let t100=null;
  for(let k=0;k<120*20;k++){vo.surHerbe=true;appliquerCommandes(vo,{gaz:1,frein:0,direction:0});pasVoiture(vo,null,DT);if(t100===null&&vo.u<100/3.6) t100=(k+1)*DT;}
  L.push('  (herbe : sous 100 km/h en '+(t100===null?'—':t100.toFixed(2)+' s')+', vitesse limite '+(vo.u*3.6).toFixed(0)+' km/h)');v(t100!==null&&t100<3,String(t100));v(vo.u*3.6>=75&&vo.u*3.6<=100,(vo.u*3.6).toFixed(0));});
t('une barrière n’est jamais traversée, même de face à 330 km/h', ()=>{const lim=C.largeur/2+REGLAGES.DISTANCE_BARRIERE-REGLAGES.DEMI_LARGEUR_VOITURE;
  for(const cote of [1,-1]){const vo=creerVoiture(C,150,0);vo.cap+=cote*Math.PI/2;vo.u=330/KMH;memoriserAvant(vo);let pire=0;
    rouler(vo,C,3,{gaz:1,frein:0,direction:0},(v_)=>{pire=Math.max(pire,Math.abs(positionSurPiste(C,v_.x,v_.z).d));});
    v(pire<=lim+1e-6,'côté '+cote+' : '+pire.toFixed(3)+' > '+lim);v(vo.contactsBarriere>0,'pas de contact');}});
t('Espace : remise au centre, dans le bon sens, à l’arrêt', ()=>{const vo=creerVoiture(C,700,15);vo.cap+=2.5;vo.u=30;remettreSurPiste(vo,C);const p=positionSurPiste(C,vo.x,vo.z);
  v(Math.abs(p.d)<0.01&&vo.u===0&&vo.v===0&&vo.r===0,'d '+p.d);const i=p.indice;v(Math.abs(Math.atan2(Math.sin(vo.cap-Math.atan2(C.tz[i],C.tx[i])),Math.cos(vo.cap-Math.atan2(C.tz[i],C.tx[i]))))<0.01,'mauvais sens');v(Math.abs(p.s-700)<3,'s '+p.s);});
t('au clavier, le gaz monte progressivement', ()=>{const vo=creerVoiture(null);for(let k=0;k<12;k++) lisserCommandes(vo,{gaz:1,frein:0,direction:0},DT);
  v(Math.abs(vo.gaz-REGLAGES.RAMPE_GAZ*0.1)<1e-9,'gaz '+vo.gaz);});

// ligne pour défendre ou pour éviter »). Ce qu'on vérifie : à la file, jamais à moins de IA_DISTANCE_MIN ; s'il contourne,
// c'est propre (écart latéral ≥ ecartSur au passage), sans barrière ni herbe ; et il finit ses 2 tours.
t('pilote IA technique : 40 m derrière une voiture à 60 % de la vitesse de la carte, sur sa ligne, 2 tours, sans attaquer : à la file (à moins de IA_FILE_DISTANCE et IA_FILE_COTE), jamais à moins de IA_DISTANCE_MIN ; s’il la contourne, c’est à au moins LARGEUR_VOITURE + IA_MARGE_LAT de côté ; 0 contact, 0 herbe', ()=>{
  const R_=REGLAGES,attaque=R_.IA_DEPASSEMENT;R_.IA_DEPASSEMENT=false;   // la voiture de devant n'est qu'un point : on teste le suivi
  const carte=CARTES_T.technique,pil=creerPilote(carte),vo=creerVoiture(TQ,0,0),c=creerCourse(TQ,0);c.etat='course';c.sAvant=vo.piste.s;c.xAvant=vo.x;c.zAvant=vo.z;
  // la voiture de devant avance sur la ligne rapide de la carte, à 60 % de sa vitesse ; le pilote ne reçoit que ce qu'il voit
  let sDevant=40,dMinFile=Infinity,herbe=0,k=0,gAvant=40,passages=[];
  for(;k<400*120&&c.progression<2*TQ.longueur;k++){const vDevant=0.6*valeurEn(TQ,carte.trajectoire.vitesse,sDevant);
    const vue={s:((sDevant%TQ.longueur)+TQ.longueur)%TQ.longueur,d:valeurEn(TQ,carte.trajectoire.ecart,sDevant),vitesse:vDevant};
    appliquerCommandes(vo,piloterIA(pil,vo,sDevant-c.progression<R_.IA_VISION_DISTANCE?[vue]:[],DT));pasVoiture(vo,TQ,DT);majCourse(c,vo,DT);
    sDevant+=vDevant*DT;const g=sDevant-c.progression,cote=Math.abs(vo.piste.d-vue.d);
    if(g>0&&g<R_.IA_FILE_DISTANCE&&cote<R_.IA_FILE_COTE) dMinFile=Math.min(dMinFile,g);   // à la file
    if(Math.sign(g)!==Math.sign(gAvant)) passages.push({s:vo.piste.s,cote});   // il la passe (ou repasse derrière)
    gAvant=g;if(vo.surHerbe) herbe++;}
  R_.IA_DEPASSEMENT=attaque;
  L.push('  (derrière une voiture à 60 % : distance la plus courte à la file '+(dMinFile===Infinity?'— (jamais à la file)':dMinFile.toFixed(2)+' m')+' ; '+(passages.length?'contournée à s = '+passages.map(p_=>p_.s.toFixed(0)+' m, écart latéral '+p_.cote.toFixed(2)+' m').join(' puis '):'pas contournée')+' ; à la fin '+(sDevant-c.progression).toFixed(1)+' m, '+(k*DT).toFixed(0)+' s pour 2 tours)');
  v(c.progression>=2*TQ.longueur,'pas fini');v(dMinFile>=R_.IA_DISTANCE_MIN,'à la file à '+dMinFile.toFixed(2)+' m');
  for(const p_ of passages) v(p_.cote>=ecartSur(vo.u),'contournement à '+p_.cote.toFixed(2)+' m de côté à s = '+p_.s.toFixed(0));
  v(vo.contactsBarriere===0,vo.contactsBarriere+' contacts');v(herbe===0,herbe+' pas dans l’herbe');});

  const a=r_.value,b=TRAJ.technique;v(n>50,n+' étapes');for(let i=0;i<TQ.nb;i++) v(a.ecart[i]===b.ecart[i]&&a.vitesse[i]===b.vitesse[i],'point '+i);});

function deuxVoitures(){const a=creerVoiture(null),b=creerVoiture(null);return {a,b};}
const quantite=ws=>ws.reduce((q,w)=>{const c_=Math.cos(w.cap),s_=Math.sin(w.cap);q[0]+=c_*w.u-s_*w.v;q[1]+=s_*w.u+c_*w.v;return q;},[0,0]);
// a, dans le repère de b : combien elle est devant (> 0) ou derrière (< 0) le centre de b

  a.x=-(REGLAGES.LONGUEUR_VOITURE+0.3);a.u=ecart;memoriserAvant(a);let pire=-Infinity,pasEnContact=0;
  for(let k=0;k<120;k++){pasVoiture(a,null,DT);pasVoiture(b,null,DT);contactsVoitures([a,b]);pire=Math.max(pire,devantDe(a,b));if(a.touche.size) pasEnContact++;}
  L.push(`  (choc à ${ecart} m/s : après 1 s, lente ${b.u.toFixed(1)} m/s, rapide ${a.u.toFixed(1)} m/s, ${pasEnContact} pas au contact, ${a.contactsVoiture} contact, choc ${a.chocMax.toFixed(1)} m/s)`);
  v(pire<=-REGLAGES.LONGUEUR_VOITURE+1e-6,'la rapide est passée à '+pire.toFixed(3)+' m du centre de la lente');v(b.u>ecart*0.4,'la lente n’a pas été poussée : '+b.u);
  v(a.contactsVoiture===1&&b.contactsVoiture===1,a.contactsVoiture+' contacts');v(Math.abs(a.chocMax-ecart)<1,'choc '+a.chocMax);});
t('contact : la quantité de mouvement des deux voitures est conservée (mêmes masses)', ()=>{const {a,b}=deuxVoitures();a.x=-5;a.u=40;a.cap=0.2;b.cap=-0.1;b.u=10;b.v=1;const q0=quantite([a,b]);
  contactsVoitures([a,b]);const q1=quantite([a,b]);v(a.contactsVoiture===1,'pas de contact');v(Math.hypot(q1[0]-q0[0],q1[1]-q0[1])<1e-9,q0+' → '+q1);});
t('contact latéral : la voiture touchée est poussée sur le côté, et les deux s’écartent', ()=>{const {a,b}=deuxVoitures();a.z=-(REGLAGES.LARGEUR_VOITURE+0.2);a.u=30;b.u=30;a.v=4;memoriserAvant(a);

  // elles roulent ensuite côte à côte, à 2 m : elles peuvent se frôler encore, mais sans chevauchement ni vrai choc
  v(b.z>0.05,'pas poussée de côté : '+b.z);v(b.z-a.z>=REGLAGES.LARGEUR_VOITURE-0.01,'chevauchement '+(b.z-a.z));v(a.chocs[0]>1,'premier choc '+a.chocs[0]);v(a.chocs.slice(1).every(c_=>c_<1),'frôlements : '+a.chocs);});
t('deux voitures au contact ne restent pas collées : posées l’une dans l’autre, elles sont séparées dès le premier pas (par le côté où elles se chevauchent le moins)', ()=>{const {a,b}=deuxVoitures();a.x=-3;contactsVoitures([a,b]);

// --- une voiture lente ou arrêtée se contourne (ordre 3 du tour 22, décision d'Elijah : « ils sont censés doubler »)
// une voiture arrêtée en sArret sur la ligne idéale, nbIA IA à l'arrêt en file derrière elle (à 40 m, puis tous les 12 m) :
// le temps pour que toutes l'aient passée, les chocs > 5 m/s, les barrières, l'herbe, et celles encore derrière
// poser une voiture d'une course entre IA ailleurs que sur la grille, sans que sa course compte le saut
function poserVoiture(p_,circ,s,d){placerSurPiste(p_.v,circ,s,d);p_.v.piste=positionSurPiste(circ,p_.v.x,p_.v.z);p_.course.sAvant=p_.v.piste.s;p_.course.xAvant=p_.v.x;p_.course.zAvant=p_.v.z;p_.course.compte=0;}
function contournerArretee(sArret,nbIA,duree){const carte=CARTES_T.technique,e=creerCourseIA(TQ,nbIA,2,1,carte,true),arret=e.pilotes[nbIA];
  poserVoiture(arret,TQ,sArret,valeurEn(TQ,carte.trajectoire.ecart,sArret));
  const d0=[];e.pilotes.forEach((p_,k)=>{if(k<nbIA){const s_=sArret-40-12*k;poserVoiture(p_,TQ,s_,valeurEn(TQ,carte.trajectoire.ecart,s_));p_.pilote.grille=null;p_.pilote.parcouru=REGLAGES.IA_DEPART_LANCEMENT;d0[k]=sArret-s_;}});   // déjà en course (pas le lancement du départ)
  const passee=(p_,k)=>p_.course.progression>d0[k]+REGLAGES.LONGUEUR_VOITURE;let temps=null,herbe=0,k=0;
  for(;k<duree*120;k++){pasCourseIA(e,DT);for(let i=0;i<nbIA;i++) if(e.pilotes[i].v.surHerbe) herbe++;
    if(e.pilotes.slice(0,nbIA).every(passee)){temps=k*DT;break;}}
  const chocs=e.pilotes.flatMap(p_=>p_.v.chocs).filter(c_=>c_>5).length/2,barr=e.pilotes.reduce((a_,p_)=>a_+p_.v.contactsBarriere,0);
  const derriere=e.pilotes.slice(0,nbIA).filter(passee_=>false).concat(e.pilotes.slice(0,nbIA).filter((p_,i)=>!passee(p_,i))).map((p_,i)=>'n°'+p_.numero+' à '+(d0[p_.numero-1]-p_.course.progression).toFixed(0)+' m');
  return {temps,chocs,barr,herbe,derriere,arretBougee:Math.abs(arret.v.u)>0.5};}

  v(r_.temps!==null&&r_.temps<=15,'temps '+r_.temps+' '+r_.derriere.join(', '));v(r_.chocs===0,r_.chocs+' chocs');v(r_.barr===0,r_.barr+' barrières');});

// --- le fantôme du meilleur tour (tour 22b, étape 5, fantome.js) : calcul pur, sur l'enregistreur

function tourFantome(marge){const vo=creerVoiture(C,0),q=QUALIFICATION.creer(C,vo);q.course.compte=0;const tour=FANTOME.commencer(),pts=[],margeAvant=REGLAGES.ROBOT_MARGE_VIRAGE;

    if(q.lance&&!finiAvant){const t_=fini?q.temps:QUALIFICATION.chrono(q),s_=fini?q.fin:QUALIFICATION.distance(q);FANTOME.noter(tour,t_,v_,s_);pts.push({t:t_,s:s_,x:v_.x,z:v_.z});}

  REGLAGES.ROBOT_MARGE_VIRAGE=margeAvant;

t('fantôme : un tour du robot enregistré puis compacté (nombres arrondis) et rejoué repasse aux mêmes positions (< 2 cm aux images, < 30 cm entre deux images) ; rejoué contre soi-même, l’écart vaut 0 (|écart| < 0,01 s sur tout le tour, écart final 0) ; la taille d’un fantôme est mesurée', ()=>{
  const a=tourFantome();v(a.q.fini&&a.q.valide,'tour pas fini');
  const f=FANTOME.compacter(a.tour,a.q.temps,a.q.fin),rejeu=FANTOME.charger(f);FANTOME_F=f;
  v(rejeu&&rejeu.nb===f.x.length&&f.x.length>100&&f.pas===REGLAGES.FANTOME_PAS,'images '+f.x.length);
  v(Math.abs(f.temps-a.q.temps)<0.001&&Math.abs(f.fin-C.longueur)<2,'temps '+f.temps+' / '+a.q.temps+', fin '+f.fin+' / '+C.longueur);
  v(f.x.every(x=>Math.round(x*100)===x*100||Math.abs(Math.round(x*100)-x*100)<1e-6),'arrondi');
  let pireImage=0,pireEntre=0,pireEcart=0,nImages=0;
  for(const p of a.pts){const q_=FANTOME.position(rejeu,p.t),d=Math.hypot(q_.x-p.x,q_.z-p.z),k=p.t/f.pas,surImage=Math.abs(k-Math.round(k))<1e-6&&k<f.x.length;
    if(surImage){pireImage=Math.max(pireImage,d);nImages++;} else if(p.t<=rejeu.duree) pireEntre=Math.max(pireEntre,d);   // après la dernière image (moins de FANTOME_PAS avant la ligne), le fantôme attend sur elle
    pireEcart=Math.max(pireEcart,Math.abs(FANTOME.ecart(rejeu,p.t,p.s)));}
  const final=FANTOME.ecartFinal(rejeu,a.q.temps);
  L.push('  (fantôme : tour du robot '+a.q.temps.toFixed(2)+' s, '+f.x.length+' images à '+f.pas+' s, '+FANTOME.taille(f)+' octets sauvegardés ; rejoué : pire écart '+(pireImage*100).toFixed(2)+' cm aux '+nImages+' images, '+(pireEntre*100).toFixed(1)+' cm entre elles ; écart contre soi-même au plus '+(pireEcart*1000).toFixed(1)+' ms, final '+final.toFixed(3)+' s)');
  v(nImages>=f.x.length-1,'images relues '+nImages+' / '+f.x.length);v(pireImage<0.02,'aux images : '+pireImage);v(pireEntre<0.3,'entre les images : '+pireEntre);
  v(pireEcart<0.01,'écart contre soi-même '+pireEcart);v(Math.abs(final)<0.001,'écart final '+final);
  v(FANTOME.taille(f)<60000,'taille '+FANTOME.taille(f));});
t('fantôme : contre un tour plus lent (robot plus prudent en virage), l’écart en direct est positif après le premier virage et grandit ; l’écart final = la différence des temps ; un tour plus lent ne remplace pas le record, un tour coupé jamais, un meilleur temps oui, le premier tour valide aussi', ()=>{

  v(!FANTOME.bat(f,b.q.temps,false),'plus lent');v(!FANTOME.bat(f,f.temps,false),'égal');v(!FANTOME.bat(f,f.temps-1,true),'coupé');v(!FANTOME.bat(null,50,true),'coupé sans record');

t('fantôme : il n’est pas une voiture : il n’a pas de place sur la piste, voituresVues ne le voit pas, et une course entre IA (pasCourseIA) ne connaît que les voitures de ses pilotes (ni contact ni aspiration possibles)', ()=>{

// --- le départ parfait (tour 22b, étape 5, depart.js) : calcul pur
// une voiture lancée de l'arrêt plein gaz avec un départ donné (resultat), sur terrain plat ; renvoie sa vitesse et sa position après 3 s
function lancement(res){const vo=creerVoiture(null),d=DEPART.creer(true);DEPART.pas(d,DT,true);DEPART.lancer(d,res,0.2);
  for(let k=0;k<360;k++){vo.facteurDepart=DEPART.facteur(d);appliquerCommandes(vo,{gaz:1,frein:0,direction:0});pasVoiture(vo,null,DT);DEPART.pas(d,DT,true);}

t('départ : une voiture neuve a facteurDepart = 1 ; un départ parfait donne exactement la voiture normale (3 s plein gaz : mêmes nombres au bit près) ; bon, patinage et calé font perdre du temps, dans cet ordre, et l’effet s’arrête après sa durée (facteur 1)', ()=>{

  const sans=creerVoiture(null);sans.facteurDepart=undefined;for(let k=0;k<360;k++){appliquerCommandes(sans,{gaz:1,frein:0,direction:0});pasVoiture(sans,null,DT);}
  const p=lancement('parfait'),b=lancement('bon'),pa=lancement('patinage'),c=lancement('cale'),f=lancement('faux');
  v(p.x===normale.x&&p.u===normale.u&&sans.x===normale.x,'parfait ≠ normale : '+p.x+' / '+normale.x+' / '+sans.x);v(f.x===normale.x,'faux ≠ normale');

  v(DEPART.resultat(bas-R.DEPART_BORD-0.01,0.1)==='cale'&&DEPART.resultat(0,0.1)==='cale','calé');

// une course avec les feux, un joueur ; appuyer(oui) = la touche d'accélérateur ; pas() = un pas de physique de la course (voiture tenue)

t('départ : pendant les feux, tenir la touche fait monter le régime (DEPART_MONTEE), la lâcher le fait descendre, la voiture n’est pas lancée ; tenir la touche pendant l’extinction ne lance pas la voiture tant qu’on ne l’a pas lâchée ; lâcher puis réappuyer lance : réaction mesurée, régime dans le vert + rapide = parfait, et le facteur moteur reste 1', ()=>{

function appuyer(codes){enfoncees.clear();for(const c of codes) enfoncees.add(c);majCibles();}

t('2 joueurs : les touches sont lues par leur place (e.code) : W A S D + E pour le joueur 1 (= Z Q S D en AZERTY, aucun KeyZ ni KeyQ), les flèches + Entrée ou Maj droite pour le joueur 2 ; les touches de l’un ne donnent jamais une commande à l’autre, seules ou ensemble', ()=>{

  for(const [nom,codes] of Object.entries(J2)) for(const c of codes){const s1=DEUX_JOUEURS.cibles(new Set([c]),1),s2=DEUX_JOUEURS.cibles(new Set([c]),2);

  // le clavier de principal.js (majCibles) range les commandes dans JEU.deuxCommandes, et seulement en mode 2 joueurs
  JEU.deux={nbIA:0,nbTours:3};appuyer(['KeyW','KeyD']);

// un pas de la course à deux avec les touches données ; les humains sont conduits par conduireJoueur (principal.js), comme dans la page
function pasADeux(e,codes){appuyer(codes);pasCourseIA(e,DT,conduireJoueur);}
// amène la course juste avant l'extinction des feux (compte = reste), personne n'appuie
function jusquAvantExtinction(e,reste){while(e.pilotes[0].course.compte>reste) pasADeux(e,[]);}

function apresExtinction(e){jusquAvantExtinction(e,0);for(let k=0;k<Math.round(REGLAGES.DEPART_ROBOT_REACTION/DT)+1;k++) pasADeux(e,[]);}
t('2 joueurs : dans la course (conduireJoueur), les touches du joueur 1 lancent et font rouler sa voiture seulement : celle du joueur 2 reste immobile au bit près (u = 0, même position), et inversement ; Espace ne remet personne en piste, E et Entrée remettent chacun le sien', ()=>{
  JEU.deux={nbIA:0,nbTours:3};
  const essai=(codes,qui)=>{const e=courseADeux(0,3,21),[p1,p2]=DEUX_JOUEURS.joueurs(e),actif=qui===1?p1:p2,autre=qui===1?p2:p1;
    const x0=autre.v.x,z0=autre.v.z;apresExtinction(e);   // les feux sont éteints depuis 0,2 s, personne n'a appuyé

    for(let k=0;k<4*120;k++) pasADeux(e,codes);   // 4 s plein gaz pour l'un

    v(autre.course.depart.lance===null&&autre.v.u===0&&autre.v.x===x0&&autre.v.z===z0,'J'+(3-qui)+' a bougé : u='+autre.v.u+' lance='+autre.course.depart.lance);

  // chacun est poussé sur l'herbe, à 5 m du bord (en deçà de la barrière) ; une remise en piste le ramène au milieu : un saut de largeur / 2 + 5 m en un pas, bien plus que sa vitesse × DT
  const loin=C.largeur/2+5,decaler=p=>{p.v.x+=loin*p.v.piste.nx;p.v.z+=loin*p.v.piste.nz;},pos=p=>[p.v.x,p.v.z],remis=(p,a)=>Math.hypot(p.v.x-a[0],p.v.z-a[1])>loin-3;
  decaler(p1);decaler(p2);let a1=pos(p1),a2=pos(p2);JEU.remettre=true;pasADeux(e,[]);
  v(!remis(p1,a1)&&!remis(p2,a2),'Espace a remis quelqu’un en piste');JEU.remettre=false;
