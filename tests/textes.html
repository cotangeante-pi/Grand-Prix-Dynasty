<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>tests des textes</title></head><body>
<pre id="res"></pre>
<script>window.__err=[];window.addEventListener('error',e=>__err.push(e.message+' @'+e.filename+':'+e.lineno));</script>
<script>
// Cette page sert aussi de « cadre » : ouverte avec ?cadre=xx-YY, elle fait croire à textes.js que le navigateur
// est dans cette langue (avant qu'il ne la lise), puis envoie à la page de test ce que renvoie texte().
const CADRE = new URLSearchParams(location.search).get('cadre');
if (CADRE && CADRE !== 'aucun') Object.defineProperty(navigator, 'language', { get: () => CADRE, configurable: true });
</script>
<script src="../textes.js"></script>
<script>
if (CADRE) {
  // le cadre : la langue choisie et quelques textes, envoyés à la page de test
  parent.postMessage({ cadre: location.search, langue: LANGUE, horsPiste: texte('horsPiste'), pause: texte('reprendre'), nom: texte('nomDuJeu') }, '*');
} else {
const L=[];let ok=0,ko=0;
function t(n,f){try{f();ok++;L.push('✔ '+n);}catch(e){ko++;L.push('✘ '+n+' — '+e.message);}}
const v=(c,m)=>{if(!c)throw new Error(m||'faux');};
function ecrire(etape){document.getElementById('res').textContent=`${etape?'EN COURS ('+etape+') ':''}RESULTAT ${ok}/${ok+ko}\n`+L.join('\n');}

// une valeur est « remplie » : une chaîne non vide (un seul caractère compte, même un espace : le séparateur des milliers « milliers »
// est une espace fine insécable en français), ou une liste de chaînes non vides
const remplie = x => typeof x === 'string' ? (x.trim() !== '' || x.length === 1) : Array.isArray(x) && x.length > 0 && x.every(remplie);
const morceaux = x => Array.isArray(x) ? x : [x];
const en = Object.keys(TEXTES.en), fr = Object.keys(TEXTES.fr);

// --- les deux langues ont les mêmes clés
t('il y a des textes en anglais et en français', ()=>{v(en.length>0&&fr.length>0, en.length+' / '+fr.length);});
t('chaque clé anglaise existe en français', ()=>{const m=en.filter(k=>!(k in TEXTES.fr));v(!m.length,'manquent : '+m.join(', '));});
t('chaque clé française existe en anglais', ()=>{const m=fr.filter(k=>!(k in TEXTES.en));v(!m.length,'manquent : '+m.join(', '));});
// --- chaque clé, une par une : en et fr non vides
for (const k of new Set([...en, ...fr]))
  t('« '+k+' » : anglais et français non vides', ()=>{v(remplie(TEXTES.en[k]),'anglais vide');v(remplie(TEXTES.fr[k]),'français vide');});
// --- les listes (colonnes du tableau) ont autant d'éléments dans les deux langues
for (const k of en.filter(k=>Array.isArray(TEXTES.en[k])))
  t('« '+k+' » : autant d’éléments en anglais et en français', ()=>{v(TEXTES.en[k].length===(TEXTES.fr[k]||[]).length,TEXTES.en[k].length+' / '+(TEXTES.fr[k]||[]).length);});
// --- les {s} et {n} à remplacer sont les mêmes dans les deux langues
t('les trous {…} sont les mêmes en anglais et en français', ()=>{const trous=x=>morceaux(x).join(' ').match(/\{[a-z]+\}/g)||[];
  const m=en.filter(k=>trous(TEXTES.en[k]).sort().join()!==trous(TEXTES.fr[k]).sort().join());v(!m.length,m.join(', '));});

// --- le nom : jamais « F1 » ni « Formula 1 » dans un texte, le nom par sa clé
t('aucun texte ne contient « F1 » ni « Formula 1 »', ()=>{const m=[];
  for (const l of ['en','fr']) for (const k of Object.keys(TEXTES[l])) for (const s of morceaux(TEXTES[l][k]))
    if (/\bF1\b|formula\s*1|formule\s*1/i.test(s)) m.push(l+'.'+k+' = '+s);
  v(!m.length,m.join(' ; '));});
t('le nom du jeu est « Grand Prix Dynasty », le même dans les deux langues', ()=>{v(TEXTES.en.nomDuJeu==='Grand Prix Dynasty',TEXTES.en.nomDuJeu);v(TEXTES.fr.nomDuJeu==='Grand Prix Dynasty',TEXTES.fr.nomDuJeu);});
t('« Grand Prix Dynasty » n’apparaît que par sa clé nomDuJeu', ()=>{const m=[];
  for (const l of ['en','fr']) for (const k of Object.keys(TEXTES[l])) if (k!=='nomDuJeu') for (const s of morceaux(TEXTES[l][k]))
    if (/dynasty/i.test(s)) m.push(l+'.'+k);
  v(!m.length,m.join(', '));});

// --- les clés que le jeu demande (relevées le 2026-10-22, rapports/audit-textes.md) existent toutes
const UTILISEES = ['aideConduite','attenteArrivee','changerLongueur','choixTitre','classementEcuries','classementPilotes','colonnesResultats',
  'continuer','courseSuivante','enCourse','fauxDepart','fin','finChampionnat','go','grandPrix','horsPiste','kmh','meilleurTour','nouveauRecord',
  'passerPodium','pause','penalite','penalites','podium','pointsGagnes','preparation','pts','recommencer','record','reglagesCopier',
  'reglagesRienChange','reglagesTitre','rejouer','reprendre','resultats','secteur','son','tempsTotal','tour','tourPrecedent','tourRetard',
  'tours','toursRetard','toursSansFin','virgule','voirResultats','tresCourte','moyenne','longue','essaiLibre',
  // les clés des 11 textes en dur de l'audit (tour 21b)
  'nomJoueur','pilote','ecurie','numero','circuit_test','circuit_technique','titreGrandPrix','placeCourse','secondes',
  // le fantôme du meilleur tour (tour 22b)
  'fantomeRecord','fantomeEcart','fantomeOui','fantomeNon',
  // le départ parfait (tour 22b)
  'departAide','departParfait','departBon','departPatinage','departCale','departFaux','departRecord',
  // le premier lancement (tour 23b)
  'titreJouer','titreAmis','retour','amisBientot','aideGaz','aideDirection','aideFrein','bravoTitre','bravoPlace','bravoArgent','bravoQuestion','bravoBouton',
  // la création du pilote (tour 23b)
  'piloteTitre','piloteNom','piloteNumero','pilotePays','piloteCoeur','piloteDomicile','piloteErreurNumero','piloteErreurCoeur','piloteValider',
  // le casque (tour 24b)
  'casqueTitre','casqueMotif','casqueCouleurs','monCasque','casqueValider','motif_uni','motif_bandes','motif_etoile','motif_flammes','motif_damier','motif_eclair',
  // le mode 2 joueurs (tour 25b)
  'joueur1','joueur2'];
t('chaque clé demandée par le jeu existe', ()=>{const m=UTILISEES.filter(k=>!(k in TEXTES.en));v(!m.length,m.join(', '));});

// --- les 11 textes en dur de l'audit (rapports/audit-textes.md) ont leur clé, dans les deux langues
t('le joueur s’appelle « You » / « Toi » tant qu’il n’a pas de nom ; pilote, écurie, numéro, place, secondes et titre du Grand Prix ont leurs trous ; les circuits d’essai ont leur texte ; la virgule en français', ()=>{
  v(TEXTES.en.nomJoueur==='You'&&TEXTES.fr.nomJoueur==='Toi','nomJoueur');
  for (const [k,trou] of [['pilote','{n}'],['ecurie','{n}'],['numero','{n}'],['placeCourse','{p}'],['placeCourse','{n}'],['secondes','{s}'],['titreGrandPrix','{i}'],['titreGrandPrix','{n}'],['titreGrandPrix','{circuit}']])
    v(TEXTES.en[k].includes(trou)&&TEXTES.fr[k].includes(trou),k+' sans '+trou);
  v(remplie(TEXTES.en.circuit_test)&&remplie(TEXTES.fr.circuit_test)&&remplie(TEXTES.en.circuit_technique)&&remplie(TEXTES.fr.circuit_technique),'circuits');
  v(TEXTES.en.virgule==='.'&&TEXTES.fr.virgule===',','virgule');});

// --- la traduction (tour 37, étape 15 : préparer Poki) : aucune phrase française dans l'anglais, aucune anglaise dans le français,
// dans tous les textes (écrans, commentateur, discussions, aides, tutoriel, manette, trajectoire conseillée, courrier, patrons…).
// On ôte d'abord les noms propres (circuits, sponsors, lieux, pays, journal), les trous {…} et les mots gardés tels quels.
const LANGUE_FR = /[éèêëàâçùûôîïœ]|(^|[^A-Za-zÀ-ÿ'’])(le|la|les|des|une|est|pour|avec|sans|pas|toi|ton|ta|tes|tu|je|mon|ma|mes|vous|nous|et|dans|du|au|aux|ce|cette|qui|que|mais|ou|très|plus|voiture|saison|course|écurie)(?![A-Za-zÀ-ÿ])/i;
const LANGUE_EN = /(^|[^A-Za-zÀ-ÿ'’])(the|and|you|your|with|without|is|are|of|to|this|that|my|it|was|be|have|has|not|for|in|at|race|season|team|car|driver)(?![A-Za-zÀ-ÿ])/i;
const NOMS_PROPRES = /^(circuit_|sponsor_|lieu_|pays_|nomDuJeu$|journal|une_nom|uneNom)/;
const sansNoms = x => x.replace(/\{\w+\}/g, ' ').replace(/protégée?s?/gi, ' ').replace(/Montréol|Brio Café|Melbourn Park|Yas Marino/g, ' ');
const phrases = x => Array.isArray(x) ? x.flatMap(phrases) : (x && typeof x === 'object') ? Object.values(x).flatMap(phrases) : typeof x === 'string' ? [x] : [];
t('aucun mot français dans les textes anglais', ()=>{const m=[];
  for (const k of en) if (!NOMS_PROPRES.test(k)) for (const s of phrases(TEXTES.en[k])) if (LANGUE_FR.test(sansNoms(s))) m.push('en.'+k+' = '+s);
  v(!m.length,m.length+' : '+m.slice(0,8).join(' ; '));});
t('aucun mot anglais dans les textes français', ()=>{const m=[];
  for (const k of fr) if (!NOMS_PROPRES.test(k)) for (const s of phrases(TEXTES.fr[k])) if (LANGUE_EN.test(sansNoms(s))) m.push('fr.'+k+' = '+s);
  v(!m.length,m.length+' : '+m.slice(0,8).join(' ; '));});
t('aucune phrase laissée telle quelle : un texte de 3 mots ou plus n’est jamais le même en anglais et en français', ()=>{const m=[];
  for (const k of en) if (!NOMS_PROPRES.test(k)) { const f=new Set(phrases(TEXTES.fr[k]));
    for (const s of phrases(TEXTES.en[k])) if (f.has(s) && (sansNoms(s).match(/[A-Za-zÀ-ÿ]{2,}/g)||[]).length>=3) m.push(k+' = '+s); }
  v(!m.length,m.join(' ; '));});
t('les listes de variantes ont des variantes dans les deux langues (aucune liste vide d’un côté)', ()=>{const m=[];
  for (const k of en) if (phrases(TEXTES.en[k]).length && !phrases(TEXTES.fr[k]).length || !phrases(TEXTES.en[k]).length && phrases(TEXTES.fr[k]).length) m.push(k);
  v(!m.length,m.join(', '));});

// --- la ponctuation par langue (tour 37c) : en anglais, pas d'espace avant « : ; ! ? » ; en français, une espace ; les deux-points collés par le code passent par « deuxPoints »
t('la ponctuation : « deuxPoints » vaut « : » collé en anglais et « : » espacé en français ; aucun texte anglais n’a d’espace avant « : ; ! ? »', ()=>{
  v(TEXTES.en.deuxPoints===': '&&TEXTES.fr.deuxPoints===' : ',JSON.stringify([TEXTES.en.deuxPoints,TEXTES.fr.deuxPoints]));
  const m=[];for (const k of en) for (const s of phrases(TEXTES.en[k])) if (/\S [:;!?](\s|$)/.test(s.replace(/\{\w+\}/g,'X'))) m.push(k+' = '+s);
  v(!m.length,m.join(' ; '));});

// --- les accords de nombre (tour 37d) : accorder() met le singulier à 1 (et à 0 en français) pour chaque unité affichée ; 2 reste au pluriel
t('les accords : « 1 pt », « 1 lap », « 1 race »… en anglais ; « 0 pt », « 1 tour », « 0 victoire »… en français ; « 2 pts » reste au pluriel', ()=>{const m=[];
  const U={en:[['pts','pt'],['laps','lap'],['races','race'],['seasons','season'],['wins','win'],['podiums','podium'],['points','point'],['titles','title']],
           fr:[['pts','pt'],['tours','tour'],['courses','course'],['saisons','saison'],['victoires','victoire'],['podiums','podium'],['points','point'],['titres','titre']]};
  for (const l of ['en','fr']) for (const [pl,sg] of U[l]) for (const n of [0,1,2]) {
    const att=(n===1||(l==='fr'&&n===0))?sg:pl, r=accorder(n+' '+pl,l);
    if (r!==n+' '+att) m.push(l+' : '+n+' '+pl+' → '+r);}
  v(!m.length,m.join(' ; '));});

// --- le français ne genre jamais le joueur (tour 37, suite) : quelques accords relevés puis rendus neutres ; aucun ne doit revenir
const GENRES = [
  [/\bfâchée?s?\b/i, 'fâché(e)'], [/\bprête?\s+pour\b/i, 'prêt(e) pour'], [/\bt’a\s+battue?\b/i, 't’a battu(e)'], [/\bm’a\s+poussée?\b/i, 'm’a poussé(e)'],
  [/\b(tu\s+es|tu\s+seras|t’es)\s+(déjà\s+)?(notre\s+|le\s+|la\s+)?(premier|première)\s+pilote\b/i, 'tu es notre premier pilote'],
  [/\btu\s+es\s+le\s+numéro\s+un\b/i, 'tu es le numéro un'], [/\bvous\s+êtes\s+touchée?s\b/i, 'vous êtes touché(e)s'],
  [/\bInquiète?\s*\?/, 'Inquiet ?'], [/\bpas\s+l’air\s+contente?\b/i, 'pas l’air content(e)'],
  [/\btu\s+es\s+(si\s+|très\s+|trop\s+)?(content|contente|déçu|déçue|fier|fière|heureux|heureuse|prêt|prête|seul|seule|motivé|motivée|désolé|désolée)\b/i, 'tu es + adjectif accordé'],
  [/\b(je\s+suis|j’étais)\s+(si\s+|très\s+|trop\s+)?(content|contente|déçu|déçue|fier|fière|heureux|heureuse|prêt|prête|seul|seule|motivé|motivée|désolé|désolée)\b/i, 'je suis + adjectif accordé'],
];
t('le français ne genre pas le joueur : ni « fâchés », ni « Prêt pour… », ni « t’a battu », ni « tu es notre premier pilote », ni « Inquiet ? »…', ()=>{const m=[];
  for (const k of fr) if (!NOMS_PROPRES.test(k)) for (const s of phrases(TEXTES.fr[k])) for (const [r, nom] of GENRES) if (r.test(s)) m.push(nom+' : fr.'+k+' = '+s);
  v(!m.length,m.join(' ; '));});
t('les accords corrigés ont gardé leur sens : la paix, la carrière, le statut, le duel perdu', ()=>{
  v(phrases(TEXTES.fr.dis_paix_deja).some(s=>/dispute/.test(s)),'dis_paix_deja');
  v(/carrière/.test(TEXTES.fr.bravoQuestion),'bravoQuestion');
  v(phrases(TEXTES.fr.pat_statut_accepte).length===phrases(TEXTES.en.pat_statut_accepte).length,'pat_statut_accepte');
  v(/devant toi/.test(TEXTES.fr.duelSaisonPerdu)&&TEXTES.fr.duelSaisonPerdu.includes('{nom}'),'duelSaisonPerdu');});

// --- texte() dans cette page : la langue du navigateur de test
t('LANGUE vaut « en » ou « fr »', ()=>{v(LANGUE==='en'||LANGUE==='fr',LANGUE);});
t('texte() renvoie la valeur de la langue choisie', ()=>{for (const k of en) v(JSON.stringify(texte(k))===JSON.stringify(TEXTES[LANGUE][k]),k);});
t('une clé inconnue donne undefined (pas d’erreur)', ()=>{v(texte('cleQuiNExistePas')===undefined);});

// --- texte() selon le navigateur : des cadres qui rechargent textes.js en simulant une autre langue
const ATTENDU = {
  '?cadre=en-US': 'en', '?cadre=en-GB': 'en', '?cadre=de-DE': 'en',   // anglais par défaut, même pour une autre langue
  '?cadre=fr-FR': 'fr', '?cadre=fr': 'fr', '?cadre=fr-CA': 'fr', '?cadre=FR-be': 'fr',
  '?cadre=fr-FR&lang=en': 'en', '?cadre=en-US&lang=fr': 'fr',           // ?lang= force la langue
  '?cadre=en-US&lang=xx': 'en',                                          // une langue inconnue est ignorée
};
const recus = {};
window.addEventListener('message', e => {
  if (!e.data || !e.data.cadre) return;
  recus[e.data.cadre] = e.data;
  if (Object.keys(recus).length < Object.keys(ATTENDU).length) return;
  for (const [cadre, langue] of Object.entries(ATTENDU)) {
    const r = recus[cadre];
    t('navigateur '+cadre.replace('?cadre=','').replace('&',' + ')+' → '+langue, ()=>{
      v(r.langue===langue,'LANGUE = '+r.langue);
      v(r.horsPiste===TEXTES[langue].horsPiste,'horsPiste = '+r.horsPiste);
      v(r.pause===TEXTES[langue].reprendre,'reprendre = '+r.pause);
      v(r.nom==='Grand Prix Dynasty','nomDuJeu = '+r.nom);
    });
  }
  t('aucune erreur JavaScript', ()=>{v(!__err.length,__err.join(' | '));});
  ecrire();
});
for (const cadre of Object.keys(ATTENDU)) {
  const f = document.createElement('iframe');
  f.src = 'textes.html' + cadre; f.style.display = 'none';
  document.body.appendChild(f);
}
ecrire('attente des cadres');
}
</script>
</body></html>
